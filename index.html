<head>

<style>
:root{
  --bg:#f4f7fb;
  --paper:#ffffff;
  --ink:#14213d;
  --muted:#64748b;
  --line:#d7dee9;
  --line-dark:#111827;
  --primary:#3157d5;
  --primary-2:#183a9e;
  --success:#16884a;
  --warning:#b7791f;
  --danger:#b42318;
  --purple:#6d28d9;
  --cyan:#087ea4;
  --soft:#eef4ff;

}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;line-height:1.35}

.app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,#172554,#223c9e);color:white;padding:22px 16px;overflow:auto;box-shadow:8px 0 30px rgba(15,23,42,.18);z-index:20}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:18px;padding:10px 8px}
.brand-mark{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#ffbf00,#51c878 48%,#2a61d8);display:grid;place-items:center;color:#fff;font-weight:900;letter-spacing:-1px}
.brand h1{font-size:16px;margin:0;line-height:1.1}.brand span{font-size:12px;opacity:.82}
.nav{display:flex;flex-direction:column;gap:6px}.nav button{border:0;background:transparent;color:rgba(255,255,255,.86);text-align:left;padding:10px 12px;border-radius:12px;display:flex;justify-content:space-between;align-items:center}.nav button:hover{background:rgba(255,255,255,.10)}.nav button.active{background:#fff;color:#172554;font-weight:800}.nav small{font-size:11px;opacity:.78}
.side-note{margin:18px 8px 0;padding:12px;border:1px solid rgba(255,255,255,.18);border-radius:14px;background:rgba(255,255,255,.08);font-size:12px;color:rgba(255,255,255,.86)}
.main{padding:24px;min-width:0}.topbar{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-bottom:18px}.topbar h2{margin:0;font-size:26px;letter-spacing:-.03em}.topbar p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 12px;border-radius:12px;font-weight:700;box-shadow:0 2px 10px rgba(15,23,42,.04)}.btn:hover{border-color:#9db0d5}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary-2)}.btn.danger{background:#fff3f1;color:var(--danger);border-color:#ffd2cb}.btn.success{background:#eafaf1;color:var(--success);border-color:#c7eed7}.btn.warning{background:#fff7e6;color:var(--warning);border-color:#ffe1a8}.btn.small{padding:6px 9px;border-radius:10px;font-size:12px}.btn.ghost{background:transparent;box-shadow:none}.btn:disabled{opacity:.55;cursor:not-allowed}
.sync-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.sync-status{padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#f8fafc;font-size:13px;color:#475569}.sync-status.ok{background:#ecfdf3;border-color:#bbf7d0;color:#166534}.sync-status.warn{background:#fffbeb;border-color:#fde68a;color:#92400e}.sync-status.bad{background:#fff1f2;border-color:#fecdd3;color:#9f1239}.security-note{padding:12px;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:13px;line-height:1.45}
.grid{display:grid;gap:16px}.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.cols-5{grid-template-columns:repeat(5,minmax(0,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 10px 35px rgba(15,23,42,.06);padding:16px;min-width:0}.card h3{margin:0 0 12px;font-size:18px;letter-spacing:-.02em}.card h4{margin:0 0 10px;font-size:15px}.card p{color:var(--muted)}
.kpi{display:grid;gap:6px}.kpi .num{font-size:30px;font-weight:900;letter-spacing:-.04em}.kpi .lbl{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}.kpi .bar{height:8px;background:#eef2f7;border-radius:999px;overflow:hidden}.kpi .bar i{display:block;height:100%;background:var(--primary);border-radius:inherit;width:0%}.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 9px;background:#fff;font-size:12px;font-weight:700;white-space:nowrap}.chip.success{background:#ecfdf3;color:var(--success);border-color:#bbf7d0}.chip.warning{background:#fffbeb;color:#b45309;border-color:#fde68a}.chip.danger{background:#fff1f2;color:#b42318;border-color:#fecdd3}.chip.blue{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}.chip.purple{background:#f5f3ff;color:#6d28d9;border-color:#ddd6fe}.chip.gray{background:#f8fafc;color:#475569;border-color:#e2e8f0}
.form{display:grid;gap:12px}.form-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:800;color:#334155;text-transform:uppercase;letter-spacing:.035em}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:12px;padding:10px 11px;background:#fff;color:var(--ink);min-width:0}.field textarea{min-height:96px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid rgba(49,87,213,.18);border-color:var(--primary)}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}.data-table{width:100%;border-collapse:collapse;min-width:760px}.data-table th,.data-table td{padding:10px;border-bottom:1px solid #eef2f7;text-align:left;vertical-align:top}.data-table th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#475569;background:#f8fafc;position:sticky;top:0;z-index:1}.data-table tr:hover td{background:#fafcff}.data-table td.actions-cell{white-space:nowrap}
.tabs-inline{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tabs-inline button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:800}.tabs-inline button.active{background:var(--ink);color:white;border-color:var(--ink)}
.hidden{display:none!important}.muted{color:var(--muted)}.section{display:none}.section.active{display:block}.split{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.sticky{position:sticky;top:16px}.divider{height:1px;background:var(--line);margin:12px 0}.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;background:#fbfdff}.req::after{content:" *";color:var(--danger)}
.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow:auto}.dow{font-size:12px;text-transform:uppercase;font-weight:900;color:#475569;padding:0 8px}.day{min-height:142px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:6px}.day.out{background:#f8fafc;color:#94a3b8}.day.today{outline:3px solid rgba(49,87,213,.15);border-color:#8fb2ff}.day-number{font-weight:900;font-size:13px;display:flex;justify-content:space-between}.event-card{position:relative;border:1px solid #dbeafe;background:#eff6ff;border-left:5px solid var(--primary);padding:7px 8px;border-radius:10px;font-size:12px;line-height:1.2;white-space:normal;word-break:normal;overflow:visible}.event-card strong{display:block;font-size:12px}.event-card .meta{color:#475569;margin-top:3px}.event-card:hover{box-shadow:0 8px 18px rgba(15,23,42,.14);z-index:5}.event-card .tooltip{display:none;position:absolute;left:0;top:100%;min-width:260px;max-width:340px;background:#0f172a;color:white;border-radius:12px;padding:10px;box-shadow:var(--shadow);z-index:10;margin-top:6px}.event-card:hover .tooltip{display:block}.event-card.oficina{border-left-color:#16884a;background:#ecfdf3;border-color:#bbf7d0}.event-card.cfdh{border-left-color:#6d28d9;background:#f5f3ff;border-color:#ddd6fe}.event-card.evento{border-left-color:#b7791f;background:#fff7ed;border-color:#fed7aa}.event-card.passeio{border-left-color:#087ea4;background:#ecfeff;border-color:#a5f3fc}.event-card.mobilizacao{border-left-color:#db2777;background:#fdf2f8;border-color:#fbcfe8}.event-card.nao{opacity:.7;text-decoration:line-through}.week-list,.day-list{display:grid;gap:10px}.agenda-item{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:start;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px}.agenda-time{font-weight:900;color:var(--primary)}
.drawer{position:fixed;right:-520px;top:0;width:500px;max-width:96vw;height:100vh;background:#fff;box-shadow:-16px 0 50px rgba(15,23,42,.25);z-index:60;transition:.25s ease;display:flex;flex-direction:column}.drawer.open{right:0}.drawer header{padding:18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.drawer main{padding:18px;overflow:auto}.overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:50}.overlay.show{display:block}
.doc-preview{background:#eee;padding:18px;border-radius:16px;overflow:auto}.official-doc{width:794px;min-height:1123px;background:white;margin:0 auto;padding:38px 42px;color:#111;font-family:Arial,sans-serif;box-shadow:0 12px 40px rgba(0,0,0,.15)}.official-doc .logos{height:70px;display:flex;align-items:center;justify-content:space-around;margin-bottom:18px}.logo-box{border:1px solid #d1d5db;border-radius:8px;height:54px;min-width:130px;padding:6px;display:grid;place-items:center;font-size:10px;text-align:center;color:#334155}.logo-box img{max-height:48px;max-width:150px;object-fit:contain}.official-doc .logos .institutional-header-image{width:100%;height:66px;object-fit:contain;display:block}.instrument-actions{display:flex;gap:6px;flex-wrap:wrap}.instrument-status{display:flex;align-items:center;justify-content:space-between;gap:10px}.official-doc .doc-footer{margin-top:14px;padding-top:8px;border-top:1px solid #111;text-align:center;font-size:10px;color:#444}.official-doc table{border-collapse:collapse;width:100%;font-size:13px}.official-doc th,.official-doc td{border:1.5px solid #111;padding:7px;vertical-align:top}.official-doc .title{font-weight:900;text-align:center}.official-doc .center{text-align:center}.official-doc .hl{background:#20ff20}.official-doc .bigbox{height:270px}.official-doc .sig{height:80px}
.model-card{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;display:grid;gap:8px}.pill-list{display:flex;gap:6px;flex-wrap:wrap}.pill-list .chip{font-size:11px}.progress-row{display:grid;grid-template-columns:160px 1fr 60px;gap:10px;align-items:center;margin:8px 0}.progress{height:10px;background:#eef2f7;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:var(--primary);border-radius:999px}.notice{border-left:4px solid var(--primary);background:#f1f5ff;padding:12px;border-radius:12px;color:#1e3a8a}.notice.warning{border-left-color:var(--warning);background:#fff8eb;color:#92400e}.notice.danger{border-left-color:var(--danger);background:#fff1f2;color:#991b1b}.print-only{display:none}
@media(max-width:1100px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:16px}.form-row,.grid.cols-4,.grid.cols-5{grid-template-columns:repeat(2,minmax(0,1fr))}.split,.grid.cols-2,.grid.cols-3{grid-template-columns:1fr}.sticky{position:static}.calendar-grid{grid-template-columns:repeat(7,210px)}}
@media(max-width:640px){.form-row,.grid.cols-4,.grid.cols-5,.sync-grid{grid-template-columns:1fr}.topbar{display:block}.nav{grid-template-columns:1fr}.official-doc{width:100%;padding:18px}.agenda-item{grid-template-columns:1fr}.calendar-grid{grid-template-columns:repeat(7,180px)}}
@media print{body{background:white}.app,.sidebar,.topbar,.nav,.actions,.btn,.no-print,.drawer,.overlay{display:none!important}.print-only{display:block}.official-doc{box-shadow:none;width:auto;min-height:auto;margin:0;padding:0}.doc-preview{background:white;padding:0}}

/* Filtros globais mensais e identificação do editor */
.global-filter-bar{display:grid;grid-template-columns:minmax(150px,.75fr) minmax(150px,.8fr) minmax(230px,1.35fr) minmax(155px,.8fr) auto;gap:10px;align-items:end;margin:-4px 0 18px;padding:14px;background:linear-gradient(135deg,#ffffff,#f7f9ff);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px rgba(15,23,42,.07)}
.global-filter-bar .field{gap:4px}.global-filter-bar label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#52617a}.global-filter-bar input,.global-filter-bar select{padding:9px 10px;border-radius:10px}.global-filter-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.filter-summary{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:9px;color:#52617a;font-size:12px}.filter-summary b{color:#1e3a8a}.editor-badge{display:inline-flex;align-items:center;gap:6px;background:#eef4ff;border:1px solid #c8d7ff;border-radius:999px;padding:5px 9px;color:#183a9e;font-weight:800}.sync-workflow-note{display:flex;gap:7px;align-items:center}.sync-workflow-note i{width:8px;height:8px;border-radius:50%;background:var(--warning);display:inline-block}.sync-workflow-note.ok i{background:var(--success)}
.multiuser-card{border:1px solid #bfdbfe;background:linear-gradient(135deg,#eff6ff,#fff);border-radius:14px;padding:12px;margin-bottom:12px;color:#1e3a8a}.multiuser-card strong{display:block;margin-bottom:4px}.multiuser-card ol{margin:6px 0 0 20px;padding:0}.multiuser-card li{margin:3px 0}.history-user{font-size:11px;color:#3157d5;font-weight:800}.conflict-warning{border-left:5px solid var(--danger);background:#fff1f2;padding:12px;border-radius:12px;color:#991b1b;margin-top:10px}
@media(max-width:1150px){.global-filter-bar{grid-template-columns:repeat(2,minmax(0,1fr))}.global-filter-actions{grid-column:1/-1}}
@media(max-width:640px){.global-filter-bar{grid-template-columns:1fr}.global-filter-actions{grid-column:auto}.filter-summary{align-items:flex-start;flex-direction:column}}



/* Chuva de ideias, insights e atas */
.idea-hero{background:linear-gradient(135deg,#eef2ff,#fff7ed);border:1px solid #dbe3ff;border-radius:18px;padding:16px;display:grid;gap:8px}.idea-hero h3{margin:0;color:#263b8f}.idea-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.idea-kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.idea-kpi b{display:block;font-size:24px;color:#183a9e}.brain-card{border:1px solid var(--line);background:#fff;border-radius:18px;padding:15px;display:grid;gap:10px}.brain-card-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.brain-card h4{margin:0;font-size:17px}.brain-meta{display:flex;gap:7px;flex-wrap:wrap}.brain-meta span{font-size:12px;background:#f5f7fb;border:1px solid #e2e8f0;border-radius:999px;padding:5px 8px}.idea-board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.idea-note{border:1px solid #dbe4ff;background:linear-gradient(145deg,#fff,#f7f9ff);border-radius:15px;padding:12px;display:grid;gap:8px}.idea-note.priority-alta{border-color:#fecaca;background:#fff7f7}.idea-note.priority-media{border-color:#fde68a;background:#fffbeb}.idea-note.priority-baixa{border-color:#bfdbfe;background:#eff6ff}.idea-note .idea-text{font-weight:750;line-height:1.4}.insight-box{white-space:pre-wrap;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:16px;padding:14px;color:#14532d;line-height:1.5}.minutes-preview{max-height:540px;overflow:auto;border:1px solid var(--line);border-radius:16px;padding:12px;background:#f8fafc}.action-row{display:grid;grid-template-columns:1.8fr 1fr 130px 130px auto;gap:8px;align-items:end;border:1px solid var(--line);border-radius:13px;padding:10px;background:#fff}.privacy-alert{border-left:5px solid #e11d48;background:#fff1f2;color:#881337;padding:12px;border-radius:14px;line-height:1.45}.brain-toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.brain-toolbar .actions{justify-content:flex-start}@media(max-width:900px){.idea-kpis,.idea-board{grid-template-columns:1fr}.action-row{grid-template-columns:1fr}}

<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">CRJ</div><div><h1>Gestão Pedagógica CRJ</h1><span>Cariacica • Planejamentos • Ideias • Atas • GitHub Sync</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-note">
      Fluxo central: planejar, executar, registrar, anexar evidências, avaliar, gerar relatório/anexo, acompanhar metas e entregar resultado.
    </div>
  </aside>
  <main class="main">
    <div class="topbar no-print">
      <div><h2 id="pageTitle">Painel Geral</h2><p id="pageSubtitle">Visão rápida da execução e pendências metodológicas.</p></div>
      <div class="actions">
        <button class="btn" onclick="exportBackup()">Exportar backup</button>
        <button class="btn success" onclick="go('backup');setTimeout(()=>document.getElementById('githubSyncCard')?.scrollIntoView({behavior:'smooth'}),80)">Sincronizar GitHub</button>
        <button class="btn primary" onclick="openQuickNew()">Nova ação</button>
      </div>
    </div>

    <div class="global-filter-bar no-print" id="globalFilterBar"></div>

    <section id="painel" class="section active"></section>
    <section id="planejamento" class="section"></section>
    <section id="oficinas" class="section"></section>
    <section id="cfdh" class="section"></section>
    <section id="eventos" class="section"></section>
    <section id="passeios" class="section"></section>
    <section id="mobilizacao" class="section"></section>
    <section id="ideias" class="section"></section>
    <section id="calendario" class="section"></section>
    <section id="registros" class="section"></section>
    <section id="jovens" class="section"></section>
    <section id="instrumentais" class="section"></section>
    <section id="relatorios" class="section"></section>
    <section id="metas" class="section"></section>
    <section id="evidencias" class="section"></section>
    <section id="backup" class="section"></section>
    <section id="config" class="section"></section>
  </main>
</div>
<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer"><header><strong id="drawerTitle">Detalhes</strong><button class="btn small" onclick="closeDrawer()">Fechar</button></header><main id="drawerBody"></main></aside>
<div class="print-only" id="printArea"></div>

<script>
'use strict';
const VERSION = '4.1-crj-ideias-atas';
const LS_KEY = 'crj_cariacica_gestao_pedagogica_' + VERSION;
const GH_SYNC_CONFIG_KEY = 'crj_github_sync_config_v1';
const GH_SYNC_TOKEN_KEY = 'crj_github_sync_token_session_v1';
const GH_LAST_SYNC_KEY = 'crj_github_last_sync_v1';
const TYPES = {
  oficina:{label:'Oficina', cls:'oficina'}, cfdh:{label:'CFDH', cls:'cfdh'}, evento:{label:'Evento', cls:'evento'}, passeio:{label:'Passeio / Vivência', cls:'passeio'}, mobilizacao:{label:'Mobilização', cls:'mobilizacao'}, mostra:{label:'Mostra', cls:'evento'}, especial:{label:'Atividade especial', cls:'evento'}

function filteredActivities(type=null){let arr=[...state.activities]; if(type) arr=arr.filter(a=>a.type===type || (type==='evento'&&['evento','mostra','especial'].includes(a.type))); return arr.sort((a,b)=>(a.date||'').localeCompare(b.date||'') || (a.start||'').localeCompare(b.start||''))}
function calcStats(){
  const acts=state.activities; const total=acts.length; const realized=acts.filter(a=>a.status==='Realizado').length; const partial=acts.filter(a=>a.status==='Parcial').length; const no=acts.filter(a=>a.status==='Não ocorreu').length;
  const hours=acts.filter(a=>a.status==='Realizado').reduce((sum,a)=>sum+hoursBetween(a.start,a.end),0);
  const cfdhHours=acts.filter(a=>a.type==='cfdh'||a.cfdh).reduce((sum,a)=>sum+(a.status==='Realizado'?hoursBetween(a.start,a.end):0),0);
  const pres=state.presences.filter(p=>p.present).length;
  const pend=pendingItems();
  return {total,realized,partial,no,hours,cfdhHours,pres,pend};
}
function hoursBetween(s,e){if(!s||!e)return 0; const [sh,sm]=s.split(':').map(Number), [eh,em]=e.split(':').map(Number); return Math.max(0,((eh*60+em)-(sh*60+sm))/60)}
function pendingItems(){
  const items=[];
  state.activities.forEach(a=>{
    if(!a.metaId) items.push({level:'danger',text:`${a.name}: sem vínculo com meta`, activityId:a.id});
    if(a.status==='Realizado'){
      const ev=state.evidences.filter(e=>e.activityId===a.id);
      const hasPhoto=ev.some(e=>e.type==='Foto');
      const hasList=state.presences.some(p=>p.activityId===a.id) || ev.some(e=>/presença/i.test(e.type+e.description));
      if(!hasList) items.push({level:'warning',text:`${a.name}: realizada sem lista de presença`, activityId:a.id});
      if(!hasPhoto) items.push({level:'warning',text:`${a.name}: realizada sem foto/evidência visual`, activityId:a.id});
      if((a.type==='cfdh'||a.cfdh) && !state.instruments.some(i=>i.activityId===a.id && /avaliação/i.test(i.formName))) items.push({level:'warning',text:`${a.name}: CFDH sem avaliação vinculada`, activityId:a.id});
    }
    if(a.status==='Não ocorreu' && !a.justification) items.push({level:'danger',text:`${a.name}: não ocorreu sem justificativa`, activityId:a.id});
    if(a.status==='Parcial' && !a.justification) items.push({level:'danger',text:`${a.name}: parcial sem explicação`, activityId:a.id});
  });
  state.plans.forEach(p=>{if(!p.metaId) items.push({level:'danger',text:`Planejamento ${p.name}: sem vínculo com meta`, planId:p.id})});
  return items;
}

function collectPlan(){
  const form=document.getElementById('planForm'); const fd=new FormData(form); const id=form.dataset.id||uid('plan');
  const p={id}; ['type','educator','partner','turma','name','initialParticipants','startDate','endDate','version','firstVersionDate','updateDate','eixo','metaId','etapa','indicador','publico','objetivoGeral','justificativa','resultadosEsperados','mobilizacao','recursos','materiaisDisponiveis','materiaisFaltantes','cargaTotal','cargaEncontro','diasSemana','horario','local','profissionais','observations'].forEach(k=>p[k]=fd.get(k)||'');
  p.contents=[...form.querySelectorAll('[data-content]')].map((el,idx)=>({tema:el.querySelector(`[name^="c_tema_"]`)?.value||'', objetivo:el.querySelector(`[name^="c_objetivo_"]`)?.value||'', atividades:el.querySelector(`[name^="c_atividades_"]`)?.value||'', recursos:el.querySelector(`[name^="c_recursos_"]`)?.value||'', carga:el.querySelector(`[name^="c_carga_"]`)?.value||'', mobilizacao:el.querySelector(`[name^="c_mobilizacao_"]`)?.value||''}));
  p.lessons=[...form.querySelectorAll('[data-lesson]')].map((el,idx)=>({n:Number(el.querySelector(`[name^="l_n_"]`)?.value||idx+1),date:el.querySelector(`[name^="l_date_"]`)?.value||'',tema:el.querySelector(`[name^="l_tema_"]`)?.value||'',objetivo:el.querySelector(`[name^="l_objetivo_"]`)?.value||'',atividades:el.querySelector(`[name^="l_atividades_"]`)?.value||'',metodologia:el.querySelector(`[name^="l_metodologia_"]`)?.value||'',recursos:el.querySelector(`[name^="l_recursos_"]`)?.value||'',faltantes:el.querySelector(`[name^="l_faltantes_"]`)?.value||'',carga:el.querySelector(`[name^="l_carga_"]`)?.value||'',responsavel:el.querySelector(`[name^="l_responsavel_"]`)?.value||'',status:el.querySelector(`[name^="l_status_"]`)?.value||'Planejado',cfdh:el.querySelector(`[name^="l_cfdh_"]`)?.value==='true',obs:el.querySelector(`[name^="l_obs_"]`)?.value||''}));
  return p;
}
function savePlanForm(){const p=collectPlan(); if(!p.name){toast('Informe o nome da atividade.'); return;} const idx=state.plans.findIndex(x=>x.id===p.id); if(idx>=0) state.plans[idx]=p; else state.plans.push(p); selectedPlanId=p.id; logChange('Planejamento salvo',p.name); save(); renderPlanejamento(); toast('Planejamento salvo.');}
function autoGenerateLessons(){
  const p=collectPlan(); const start=document.getElementById('genStart').value||p.startDate, end=document.getElementById('genEnd').value||p.endDate; const dowName=(p.diasSemana||'').toLowerCase();
  const map={'domingo':0,'segunda':1,'segunda-feira':1,'terça':2,'terca':2,'terça-feira':2,'terca-feira':2,'quarta':3,'quarta-feira':3,'quinta':4,'quinta-feira':4,'sexta':5,'sexta-feira':5,'sábado':6,'sabado':6};
  let dow=Object.keys(map).find(k=>dowName.includes(k)); dow=dow?map[dow]:new Date(start+'T00:00:00').getDay();
  const arr=[]; let d=new Date(start+'T00:00:00'); const limit=new Date(end+'T00:00:00'); while(d<=limit){if(d.getDay()===dow){const n=arr.length+1; arr.push({n,date:d.toISOString().slice(0,10),tema:`${p.name||'Atividade'} - aula ${n}`,objetivo:'',atividades:'',metodologia:'',recursos:p.recursos||'',faltantes:p.materiaisFaltantes||'',carga:p.cargaEncontro||'',responsavel:p.educator||'',status:'Planejado',cfdh:false,obs:''});} d.setDate(d.getDate()+1)}
  p.lessons=arr; const idx=state.plans.findIndex(x=>x.id===p.id); if(idx>=0) state.plans[idx]=p; else state.plans.push(p); selectedPlanId=p.id; save(); renderPlanejamento(); toast(`${arr.length} aulas geradas.`);
}
function createActivitiesFromPlan(){
  const p=collectPlan(); if(!p.name){toast('Salve/informe o nome do planejamento.');return} savePlanForm(); const [st,en]=parseHorario(p.horario); let created=0;
  (p.lessons||[]).forEach(l=>{if(!l.date)return; const exists=state.activities.some(a=>a.planId===p.id && a.date===l.date && a.name===(l.tema||p.name)); if(exists)return; const type=p.type.includes('cfdh')?'cfdh':p.type==='mobilizacao'?'mobilizacao':p.type==='passeio'?'passeio':p.type==='oficina'?'oficina':'evento'; state.activities.push({id:uid('act'),planId:p.id,type,name:l.tema||p.name,educator:l.responsavel||p.educator,partner:p.partner,date:l.date,start:st,end:en,local:p.local,status:l.status||'Planejado',metaId:p.metaId,oficina:p.name,cfdh:!!l.cfdh,expected:Number(p.initialParticipants||0),present:0,objectives:l.objetivo||p.objetivoGeral,resources:l.recursos||p.recursos,observations:l.obs||''}); created++;});
  logChange('Planejamento virou calendário',`${created} atividades criadas para ${p.name}`); save(); renderPlanejamento(); toast(`${created} itens enviados para o calendário.`);
}
function parseHorario(h){const m=(h||'').match(/(\d{1,2}:\d{2}).*?(\d{1,2}:\d{2})/); return m?[m[1],m[2]]:['','']}

><td><b>13. Observações:</b></td></tr><tr><td class="bigbox">${nl2br(p.observations)}</td></tr></table></div>`;

function printHTML(html,title='documento'){const w=window.open('','_blank'); w.document.write(`<!doctype html><html><head><title>${esc(title)}</title><meta charset="utf-8"><style>${document.querySelector('style').textContent}</style></head><body><div class="doc-preview">${html}</div><script>setTimeout(()=>window.print(),500)<\/script></body></html>`); w.document.close()}
function downloadBlob(blob,name,type){const a=document.createElement('a'); a.href=URL.createObjectURL(blob instanceof Blob?blob:new Blob([blob],{type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}

function activityMiniForm(type='oficina', cfdhKind=''){return `<form class="form" id="quickActivity" onsubmit="return false"><div class="form-row" style="grid-template-columns:1fr 1fr"><div class="field"><label>Tipo</label><select name="type"><option value="oficina" ${type==='oficina'?'selected':''}>Oficina</option><option value="cfdh" ${type==='cfdh'?'selected':''}>CFDH</option><option value="evento" ${type==='evento'?'selected':''}>Evento</option><option value="passeio" ${type==='passeio'?'selected':''}>Passeio/Vivência</option><option value="mobilizacao" ${type==='mobilizacao'?'selected':''}>Mobilização</option></select></div><div class="field"><label>Educador</label><select name="educator">${educatorOptions()}</select></div></div><div class="field"><label>Nome</label><input name="name" placeholder="Nome da ação"></div><div class="form-row" style="grid-template-columns:1fr 1fr"><div class="field"><label>Data</label><input type="date" name="date" value="${todayISO()}"></div><div class="field"><label>Local</label><input name="local" placeholder="Local"></div></div><div class="form-row" style="grid-template-columns:1fr 1fr"><div class="field"><label>Início</label><input type="time" name="start"></div><div class="field"><label>Término</label><input type="time" name="end"></div></div><div class="field"><label>Meta vinculada</label><select name="metaId">${metaOptions(type==='cfdh'?'meta-cfdh':type==='mobilizacao'?'meta-mobilizacao':type==='passeio'?'meta-vivencias':type==='evento'?'meta-eventos':'meta-oficinas')}</select></div><div class="field"><label>Objetivo / relato</label><textarea name="objectives"></textarea></div>${type==='cfdh'?`<div class="field"><label>Tipo de CFDH</label><select name="cfdhKind"><option ${cfdhKind==='transversal'?'selected':''}>transversal</option><option ${cfdhKind==='estrutural'?'selected':''}>estrutural</option></select></div>`:''}<button class="btn primary" onclick="saveQuickActivity()">Salvar ação</button></form>`}
function saveQuickActivity(){const form=document.getElementById('quickActivity'); const fd=new FormData(form); const type=fd.get('type'); const a={id:uid('act'),type,name:fd.get('name')||'Atividade sem nome',educator:fd.get('educator')||'',date:fd.get('date')||todayISO(),local:fd.get('local')||'',start:fd.get('start')||'',end:fd.get('end')||'',status:'Planejado',metaId:fd.get('metaId')||'',objectives:fd.get('objectives')||'',resources:'',observations:'',expected:0,present:0,cfdh:type==='cfdh', cfdhKind:fd.get('cfdhKind')||''}; state.activities.push(a); logChange('Ação criada',a.name); save(); closeDrawer(); renderSection(); toast('Ação criada.');}
function openActivity(id){const a=state.activities.find(x=>x.id===id); if(!a)return; selectedActivityId=id; const ev=state.evidences.filter(e=>e.activityId===id); const instr=state.instruments.filter(i=>i.activityId===id); openDrawer(a.name, `<div class="pill-list"><span class="chip blue">${esc(TYPES[a.type]?.label||a.type)}</span>${statusChip(a.status)}${a.cfdh?'<span class="chip purple">CFDH</span>':''}</div><p><b>Data:</b> ${fmtDate(a.date)} ${esc(a.start||'')} ${a.end?'às '+esc(a.end):''}<br><b>Local:</b> ${esc(a.local||'')}<br><b>Educador:</b> ${esc(a.educator||'')}<br><b>Meta:</b> ${esc(metaName(a.metaId)||'Sem vínculo definido')}</p><p><b>Objetivo:</b><br>${nl2br(a.objectives||'')}</p><p><b>Observações:</b><br>${nl2br(a.observations||'')}</p><div class="divider"></div><div class="actions"><button class="btn primary" onclick="openRecordFor('${id}')">Registrar execução</button><button class="btn" onclick="addEvidenceFor('${id}')">Anexar evidência</button><button class="btn" onclick="generateActivityReport('${id}')">Gerar relatório</button></div><div class="divider"></div><h4>Evidências</h4>${ev.length?ev.map(e=>`<div class="model-card"><b>${esc(e.type)}</b><span class="muted">${esc(e.description)}</span><span>${statusChip(e.status||'Pendente validação')}</span></div>`).join(''):'<div class="empty">Sem evidências.</div>'}<h4>Instrumentais</h4>${instr.length?instr.map(i=>`<div class="model-card"><b>${esc(i.formName)}</b>${statusChip(i.status)}</div>`).join(''):'<div class="empty">Sem instrumentais vinculados.</div>'}`)}
function addEvidenceFor(id){go('evidencias'); closeDrawer(); setTimeout(()=>{const sel=document.querySelector('#evActivity'); if(sel)sel.value=id},50)}
function openRecordFor(id){selectedActivityId=id; go('registros'); closeDrawer()}
function renderCalendario(){
  const y=calendarDate.getFullYear(), m=calendarDate.getMonth();
  document.getElementById('calendario').innerHTML=`<div class="card"><div class="calendar-head"><div class="actions"><button class="btn" onclick="calendarDate.setMonth(calendarDate.getMonth()-1);renderCalendario()">Mês anterior</button><button class="btn" onclick="calendarDate=new Date();renderCalendario()">Hoje</button><button class="btn" onclick="calendarDate.setMonth(calendarDate.getMonth()+1);renderCalendario()">Próximo mês</button><button class="btn primary" onclick="downloadCalendarA4()">Baixar calendário visual A4</button></div><h3>${calendarDate.toLocaleString('pt-BR',{month:'long',year:'numeric'})}</h3><div class="tabs-inline"><button class="${calendarMode==='month'?'active':''}" onclick="calendarMode='month';renderCalendario()">Mensal</button><button class="${calendarMode==='week'?'active':''}" onclick="calendarMode='week';renderCalendario()">Semanal</button><button class="${calendarMode==='day'?'active':''}" onclick="calendarMode='day';renderCalendario()">Diário</button></div></div>${calendarFilters()}<div id="calendarContent">${calendarMode==='month'?monthView(y,m):calendarMode==='week'?weekView(calendarDate):dayView(calendarDate)}</div></div>`;
}
function calendarFilters(){return `<div class="form-row" style="margin-bottom:12px"><div class="field"><label>Educador</label><select id="filterEducador" onchange="renderCalendario()"><option value="">Todos</option>${state.config.educators.map(e=>`<option>${esc(e)}</option>`).join('')}</select></div><div class="field"><label>Tipo</label><select id="filterTipo" onchange="renderCalendario()"><option value="">Todos</option>${Object.keys(TYPES).map(k=>`<option value="${k}">${TYPES[k].label}</option>`).join('')}</select></div><div class="field"><label>Status</label><select id="filterStatus" onchange="renderCalendario()"><option value="">Todos</option>${STATUS.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label>Visualização</label><select id="filterCompact" onchange="renderCalendario()"><option value="detalhada">Detalhada</option><option value="compacta">Compacta</option></select></div></div>`}
function calFiltered(){const ed=document.getElementById('filterEducador')?.value||'', tp=document.getElementById('filterTipo')?.value||'', st=document.getElementById('filterStatus')?.value||''; return state.activities.filter(a=>(!ed||String(a.educator||'').includes(ed))&&(!tp||a.type===tp)&&(!st||a.status===st));}
function monthView(y,m){const first=new Date(y,m,1), start=new Date(first); start.setDate(1-first.getDay()); const today=todayISO(); const dows=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb']; let html=`<div class="calendar-grid">${dows.map(d=>`<div class="dow">${d}</div>`).join('')}`; for(let i=0;i<42;i++){const d=new Date(start); d.setDate(start.getDate()+i); const iso=d.toISOString().slice(0,10); const acts=calFiltered().filter(a=>a.date===iso); html+=`<div class="day ${d.getMonth()!==m?'out':''} ${iso===today?'today':''}"><div class="day-number"><span>${d.getDate()}</span><span>${acts.length?acts.length:''}</span></div>${acts.map(eventCard).join('')}</div>`} return html+'</div>'}
function weekView(date){const d=new Date(date); d.setDate(d.getDate()-d.getDay()); let html='<div class="week-list">'; for(let i=0;i<7;i++){const x=new Date(d);x.setDate(d.getDate()+i);const iso=x.toISOString().slice(0,10); const acts=calFiltered().filter(a=>a.date===iso); html+=`<div class="card"><h3>${x.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'})}</h3>${agendaList(acts)}</div>`} return html+'</div>'}
function dayView(date){const iso=date.toISOString().slice(0,10); return `<div class="day-list">${agendaList(calFiltered().filter(a=>a.date===iso))}</div>`}
function eventCard(a){return `<div class="event-card ${TYPES[a.type]?.cls||''} ${a.status==='Não ocorreu'?'nao':''}" onclick="openActivity('${a.id}')"><strong>${esc(a.name)}</strong><span class="meta">${esc(a.start||'')} • ${esc(a.educator||'')}</span><div class="tooltip"><b>${esc(a.name)}</b><br>Tipo: ${esc(TYPES[a.type]?.label||a.type)}<br>Educador: ${esc(a.educator||'')}<br>Parceiro: ${esc(a.partner||'')}<br>Horário: ${esc(a.start||'')} ${a.end?'às '+esc(a.end):''}<br>Local: ${esc(a.local||'')}<br>Meta: ${esc(metaName(a.metaId)||'Sem vínculo')}<br>Status: ${esc(a.status||'Planejado')}<br>Pendências: ${pendingItems().filter(p=>p.activityId===a.id).length}<br>Obs.: ${esc(a.observations||'')}</div></div>`}
function calendarA4Activities(y,m){return calFiltered().filter(a=>{if(!a.date)return false;const d=new Date(a.date+'T12:00:00');return d.getFullYear()===y&&d.getMonth()===m}).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.start||'').localeCompare(b.start||''))}
function calendarA4HTML(y,m){
  const acts=calendarA4Activities(y,m), first=new Date(y,m,1), start=new Date(first); start.setDate(1-first.getDay());
  const dows=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
  const maxPerDay=Math.max(0,...Array.from({length:42},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);const iso=d.toISOString().slice(0,10);return acts.filter(a=>a.date===iso).length}));
  const dense=maxPerDay>=4||acts.length>48;
  let cells='';
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i); const iso=d.toISOString().slice(0,10); const dayActs=acts.filter(a=>a.date===iso);
    cells+=`<div class="a4-day ${d.getMonth()!==m?'outside':''}"><div class="a4-date">${d.getDate()}</div><div class="a4-events">${dayActs.map(a=>`<div class="a4-event ${esc(TYPES[a.type]?.cls||'evento')}"><b>${esc(a.start||'')}</b> ${esc(a.name)}<span>${esc(a.educator||'')} • ${esc(a.local||'')}</span></div>`).join('')}</div></div>`;
  }
  const legend=Object.entries(TYPES).map(([k,v])=>`<span class="legend-item"><i class="${esc(v.cls)}"></i>${esc(v.label)}</span>`).join('');
  return `<main class="a4-sheet ${dense?'dense':''}"><header><div><h1>Calendário Visual - ${esc(state.config.crjName||'CRJ Cariacica')}</h1><p>${new Date(y,m,1).toLocaleString('pt-BR',{month:'long',year:'numeric'})} • ${acts.length} atividades planejadas</p></div><img src="${DEFAULT_HEADER_LOGO_DATA}" alt="Cabeçalho institucional"></header><section class="a4-calendar"><div class="a4-dows">${dows.map(x=>`<div>${x}</div>`).join('')}</div><div class="a4-grid">${cells}</div></section><footer><div class="legend">${legend}</div><small>Gerado pelo aplicativo de planejamento e acompanhamento do CRJ • ${new Date().toLocaleDateString('pt-BR')}</small></footer></main>`
}
function downloadCalendarA4(){
  const y=calendarDate.getFullYear(),m=calendarDate.getMonth(), html=calendarA4HTML(y,m), title=safeName(`calendario_visual_${y}_${String(m+1).padStart(2,'0')}`);
  const css=`@page{size:A4 landscape;margin:5mm}*{box-sizing:border-box}html,body{margin:0;padding:0;width:287mm;height:200mm;overflow:hidden;background:#fff;font-family:Arial,sans-serif;color:#111}.a4-sheet{width:285mm;height:196mm;overflow:hidden;display:grid;grid-template-rows:16mm 1fr 10mm;gap:2mm}.a4-sheet header{display:flex;align-items:center;justify-content:space-between;border-bottom:1.5px solid #111;padding:0 2mm 2mm}.a4-sheet header h1{font-size:17pt;line-height:1;margin:0 0 2mm}.a4-sheet header p{font-size:8pt;margin:0;color:#475569}.a4-sheet header img{width:92mm;height:14mm;object-fit:contain}.a4-calendar{display:grid;grid-template-rows:7mm 1fr;min-height:0}.a4-dows{display:grid;grid-template-columns:repeat(7,1fr);background:#111827;color:#fff;border:1px solid #111827}.a4-dows div{display:grid;place-items:center;font-weight:800;font-size:7.5pt;border-right:1px solid #374151}.a4-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);min-height:0;border-left:1px solid #111;border-top:1px solid #111}.a4-day{position:relative;min-width:0;min-height:0;border-right:1px solid #111;border-bottom:1px solid #111;padding:4mm 1.2mm 1mm;overflow:hidden;background:#fff}.a4-day.outside{background:#f4f4f5;color:#9ca3af}.a4-date{position:absolute;top:.8mm;right:1.2mm;font-size:7pt;font-weight:800}.a4-events{display:flex;flex-direction:column;gap:.7mm}.a4-event{font-size:6.15pt;line-height:1.12;padding:.65mm .8mm;border-left:1.2mm solid #3157d5;background:#eff6ff;overflow-wrap:anywhere}.a4-event b{font-size:5.8pt}.a4-event span{display:block;font-size:5.1pt;color:#475569;margin-top:.25mm}.a4-event.oficina{border-left-color:#16884a;background:#ecfdf3}.a4-event.cfdh{border-left-color:#6d28d9;background:#f5f3ff}.a4-event.evento{border-left-color:#b7791f;background:#fff7ed}.a4-event.passeio{border-left-color:#087ea4;background:#ecfeff}.a4-event.mobilizacao{border-left-color:#db2777;background:#fdf2f8}.dense .a4-event{font-size:5.4pt;line-height:1.04;padding:.45mm .55mm}.dense .a4-event span{font-size:4.7pt}.a4-sheet footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #111;padding-top:1.5mm;gap:4mm}.legend{display:flex;gap:3mm;flex-wrap:wrap}.legend-item{font-size:6pt;display:flex;align-items:center;gap:1mm}.legend-item i{width:2.8mm;height:2.8mm;border-radius:50%;background:#3157d5}.legend-item i.oficina{background:#16884a}.legend-item i.cfdh{background:#6d28d9}.legend-item i.evento{background:#b7791f}.legend-item i.passeio{background:#087ea4}.legend-item i.mobilizacao{background:#db2777}.a4-sheet footer small{font-size:5.7pt;color:#475569;white-space:nowrap}@media print{html,body{width:287mm;height:200mm;overflow:hidden}.a4-sheet{break-inside:avoid;page-break-inside:avoid}}`;
  const w=window.open('','_blank'); if(!w){toast('Permita pop-ups para baixar o calendário.');return} w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>${css}</style></head><body>${html}<script>setTimeout(()=>window.print(),500)<\/script></body></html>`);w.document.close();
}
function renderRegistros(){const a=state.activities.find(x=>x.id===selectedActivityId)||state.activities[0]; if(a)selectedActivityId=a.id; document.getElementById('registros').innerHTML=`<div class="split"><div class="card"><h3>Registro em tempo real</h3><div class="field"><label>Atividade</label><select onchange="selectedActivityId=this.value;renderRegistros()">${state.activities.map(x=>`<option value="${x.id}" ${x.id===selectedActivityId?'selected':''}>${fmtDate(x.date)} — ${esc(x.name)}</option>`).join('')}</select></div>${a?recordForm(a):'<div class="empty">Crie uma atividade primeiro.</div>'}</div><div class="card sticky"><h3>Histórico de registros</h3>${recordsList(a?.id)}</div></div>`}
function recordForm(a){const pres=state.presences.filter(p=>p.activityId===a.id); return `<form class="form" id="recordForm" onsubmit="return false"><div class="notice">O registro salva início, término, presença, fotos/evidências, ocorrência, CFDH, avaliação, encaminhamento e justificativa quando parcial ou não realizada.</div><div class="form-row"><div class="field"><label>Status</label><select name="status" onchange="toggleJustification(this.value)">${STATUS.map(s=>`<option ${a.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Público presente</label><input type="number" name="present" value="${esc(a.present||0)}"></div><div class="field"><label>Início real</label><input type="time" name="realStart" value="${esc(a.realStart||a.start||'')}"></div><div class="field"><label>Término real</label><input type="time" name="realEnd" value="${esc(a.realEnd||a.end||'')}"></div></div><div class="form-row"><div class="field"><label>Materiais usados</label><textarea name="usedMaterials">${esc(a.usedMaterials||a.resources||'')}</textarea></div><div class="field"><label>Observação rápida</label><textarea name="recordObs">${esc(a.recordObs||'')}</textarea></div><div class="field"><label>Ocorrência</label><textarea name="occurrence">${esc(a.occurrence||'')}</textarea></div><div class="field"><label>Justificativa/explicação</label><textarea name="justification" ${['Não ocorreu','Parcial'].includes(a.status)?'required':''}>${esc(a.justification||'')}</textarea></div></div><div class="form-row"><div class="field"><label>Houve CFDH?</label><select name="cfdh"><option value="false" ${!a.cfdh?'selected':''}>Não</option><option value="true" ${a.cfdh?'selected':''}>Sim</option></select></div><div class="field"><label>Houve avaliação?</label><select name="evaluation"><option value="false" ${!a.evaluation?'selected':''}>Não</option><option value="true" ${a.evaluation?'selected':''}>Sim</option></select></div><div class="field"><label>Houve encaminhamento?</label><select name="referral"><option value="false" ${!a.referral?'selected':''}>Não</option><option value="true" ${a.referral?'selected':''}>Sim</option></select></div><div class="field"><label>Evidência rápida</label><input type="file" id="quickEvidenceFile" accept="image/*,.pdf,.doc,.docx" multiple></div></div><h4>Presenças rápidas</h4><div class="actions"><button type="button" class="btn small" onclick="addYouthInline()">Cadastrar jovem</button><button type="button" class="btn small" onclick="markAllPresent('${a.id}')">Marcar todos presentes</button></div><div id="presenceBox">${presenceBox(a.id)}</div><button class="btn primary" onclick="saveRecord('${a.id}')">Salvar registro</button></form>`}
function toggleJustification(v){/* visual requirement handled on save */}
function presenceBox(activityId){return state.youth.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Presente</th><th>Jovem</th><th>Contato</th></tr></thead><tbody>${state.youth.map(y=>{const p=state.presences.find(p=>p.activityId===activityId&&p.youthId===y.id); return `<tr><td><input type="checkbox" data-pres-y="${y.id}" ${p?.present?'checked':''}></td><td>${esc(y.name)}</td><td>${esc(y.phone||'')}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Cadastre jovens na aba Jovens ou pelo botão acima.</div>'}
function addYouthInline(){const name=prompt('Nome do jovem:'); if(!name)return; const phone=prompt('Contato/telefone (opcional):')||''; state.youth.push({id:uid('y'),name,phone,createdAt:new Date().toISOString()}); save(); renderRegistros()}
function markAllPresent(id){document.querySelectorAll('[data-pres-y]').forEach(i=>i.checked=true)}
function saveRecord(id){const a=state.activities.find(x=>x.id===id); const form=document.getElementById('recordForm'); const fd=new FormData(form); const status=fd.get('status'); const just=fd.get('justification')||''; if(['Não ocorreu','Parcial'].includes(status)&&!just.trim()){toast('Justificativa/explicação obrigatória.'); return;} Object.assign(a,{status,present:Number(fd.get('present')||0),realStart:fd.get('realStart')||'',realEnd:fd.get('realEnd')||'',usedMaterials:fd.get('usedMaterials')||'',recordObs:fd.get('recordObs')||'',occurrence:fd.get('occurrence')||'',justification:just,cfdh:fd.get('cfdh')==='true',evaluation:fd.get('evaluation')==='true',referral:fd.get('referral')==='true'});
  document.querySelectorAll('[data-pres-y]').forEach(cb=>{const yid=cb.dataset.presY; let p=state.presences.find(p=>p.activityId===id&&p.youthId===yid); if(!p){p={id:uid('pre'),activityId:id,youthId:yid,date:a.date,present:false}; state.presences.push(p)} p.present=cb.checked;});
  const files=document.getElementById('quickEvidenceFile').files; if(files.length){[...files].forEach(file=>state.evidences.push({id:uid('ev'),activityId:id,type:file.type.startsWith('image/')?'Foto':'Documento preenchido',date:todayISO(),responsible:a.educator,description:file.name,fileName:file.name,status:'Pendente validação'}));}
  state.records.unshift({id:uid('rec'),activityId:id,date:new Date().toISOString(),status:a.status,summary:a.recordObs||a.occurrence||'Registro salvo'}); logChange('Registro salvo',a.name); save(); renderRegistros(); toast('Registro salvo.');}
function recordsList(id){const arr=state.records.filter(r=>r.activityId===id); return arr.length?arr.map(r=>`<div class="model-card"><b>${fmtDateTime(r.date)}</b>${statusChip(r.status)}<span>${esc(r.summary)}</span></div>`).join(''):'<div class="empty">Sem registros ainda.</div>'}
function renderJovens(){document.getElementById('jovens').innerHTML=`<div class="grid cols-2"><div class="card"><h3>Cadastrar jovem</h3><form class="form" id="youthForm" onsubmit="return false"><div class="field"><label>Nome</label><input name="name"></div><div class="field"><label>Contato</label><input name="phone"></div><div class="field"><label>Observação interna</label><textarea name="obs"></textarea></div><button class="btn primary" onclick="saveYouth()">Salvar jovem</button></div></div><div class="card"><h3>Alertas de frequência</h3>${absenceAlerts()}</div></div><div class="card" style="margin-top:16px"><h3>Jovens e presenças</h3>${youthTable()}</form>`}
function saveYouth(){const f=document.getElementById('youthForm'); const fd=new FormData(f); if(!fd.get('name')){toast('Informe o nome.');return} state.youth.push({id:uid('y'),name:fd.get('name'),phone:fd.get('phone'),obs:fd.get('obs'),createdAt:new Date().toISOString()}); logChange('Jovem cadastrado',fd.get('name')); save(); renderJovens(); toast('Jovem salvo.')}
function youthTable(){return state.youth.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Jovem</th><th>Contato</th><th>Presenças</th><th>Faltas</th><th>Ações</th></tr></thead><tbody>${state.youth.map(y=>{const ps=state.presences.filter(p=>p.youthId===y.id), pres=ps.filter(p=>p.present).length, abs=ps.filter(p=>!p.present).length; return `<tr><td><b>${esc(y.name)}</b><br><span class="muted">${esc(y.obs||'')}</span></td><td>${esc(y.phone||'')}</td><td>${pres}</td><td>${abs}</td><td><button class="btn small" onclick="downloadPresenceForYouth('${y.id}')">Exportar ficha</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Nenhum jovem cadastrado.</div>'}
function absenceAlerts(){const rows=state.youth.map(y=>({y,abs:state.presences.filter(p=>p.youthId===y.id&&!p.present).length})).filter(x=>x.abs>=3); return rows.length?rows.map(x=>`<div class="notice warning" style="margin-bottom:8px">${esc(x.y.name)} com ${x.abs} faltas registradas.</div>`).join(''):'<div class="empty">Sem alerta de evasão.</div>'}
function renderInstrumentais(){
  const forms=[...OFFICIAL_FORMS,...SUGGESTED_FORMS];
  document.getElementById('instrumentais').innerHTML=`<div class="split"><div class="card"><h3>Instrumentais da Metodologia</h3><p class="muted">Os botões de modelo geram o anexo vazio. Depois de preencher e salvar, use os botões DOCX/PDF do instrumental vinculado para baixar o documento com os dados registrados.</p><div class="table-wrap"><table class="data-table"><thead><tr><th>Instrumental</th><th>Tipo</th><th>Uso</th><th>Ações</th></tr></thead><tbody>${forms.map(f=>`<tr><td><b>${esc(f.nome)}</b></td><td>${f.tipo==='Oficial'?'<span class="chip blue">Oficial</span>':'<span class="chip warning">Sugerido</span>'}</td><td>${esc(f.uso)}</td><td><div class="instrument-actions"><button class="btn small primary" onclick="fillInstrument('${f.id}')">Preencher</button><button class="btn small" onclick="downloadInstrument('${f.id}')">Modelo DOCX</button><button class="btn small" onclick="printInstrument('${f.id}')">Modelo PDF</button></div></td></tr>`).join('')}</tbody></table></div></div><div class="card sticky"><h3>Instrumentais preenchidos e vinculados</h3>${state.instruments.length?state.instruments.map(i=>`<div class="model-card"><div class="instrument-status"><div><b>${esc(i.formName)}</b><br><span>${esc(activityName(i.activityId)||'Sem atividade')}</span><br><span class="muted">${fmtDateTime(i.date)}</span></div>${statusChip(i.status)}</div><div class="instrument-actions"><button class="btn small" onclick="fillInstrument('${i.formId}','${i.id}')">Editar</button><button class="btn small primary" onclick="downloadFilledInstrument('${i.id}')">Baixar DOCX preenchido</button><button class="btn small" onclick="printFilledInstrument('${i.id}')">Baixar PDF preenchido</button><button class="btn small success" onclick="validateInstrument('${i.id}')">Validar</button></div></div>`).join(''):'<div class="empty">Nenhum instrumental preenchido.</div>'}</div></div>`
}
function fillInstrument(fid,instrumentId=''){
  const f=[...OFFICIAL_FORMS,...SUGGESTED_FORMS].find(x=>x.id===fid), existing=instrumentId?state.instruments.find(x=>x.id===instrumentId):null;
  const opts=state.activities.map(a=>`<option value="${a.id}" ${existing?.activityId===a.id?'selected':''}>${fmtDate(a.date)} — ${esc(a.name)}</option>`).join('');
  const initialContent=existing?.content||defaultInstrumentText(fid,existing?.activityId||'');
  openDrawer(existing?'Editar instrumental':'Preencher instrumental', `<form class="form" id="instrumentForm" onsubmit="return false"><input type="hidden" name="fid" value="${fid}"><input type="hidden" name="instrumentId" value="${esc(instrumentId)}"><div class="field"><label>Instrumental</label><input value="${esc(f.nome)}" disabled></div><div class="field"><label>Atividade vinculada</label><select name="activityId" onchange="prefillInstrumentContent('${fid}',this.value)"><option value="">Sem atividade</option>${opts}</select></div><div class="field"><label>Conteúdo / observações editáveis</label><textarea name="content" id="instrumentContent">${esc(initialContent)}</textarea></div><div class="field"><label>Status</label><select name="status"><option ${existing?.status==='Pendente'?'selected':''}>Pendente</option><option ${existing?.status==='Preenchido'?'selected':''}>Preenchido</option><option ${existing?.status==='Validado'?'selected':''}>Validado</option></select></div><div class="notice">Ao baixar, os dados da atividade, o conteúdo preenchido, a identificação institucional, as tabelas, bordas, assinaturas e rodapé serão organizados no modelo formal do anexo.</div><button class="btn primary" onclick="saveInstrument()">Salvar instrumental</button></form>`)
}
function prefillInstrumentContent(fid,aid){const box=document.getElementById('instrumentContent');if(!box)return;const current=box.value.trim();if(!current||current===defaultInstrumentText(fid,''))box.value=defaultInstrumentText(fid,aid)}
function defaultInstrumentText(fid,aid=''){
  const a=state.activities.find(x=>x.id===aid);
  const base={
    'inicial':'Registrar identificação, forma de acesso ao CRJ, demandas apresentadas, interesses, autorizações e observações do acolhimento.',
    'presenca':'Lista de presença e contato vinculada à atividade. Conferir nome, contato e assinatura quando impresso.',
    'acompanhamento':'Registrar demanda, escuta realizada, encaminhamentos, responsáveis, prazos e retorno do acompanhamento.',
    'pvida':'Registrar sonhos, objetivos, possibilidades, rede de apoio, ações pactuadas, responsáveis e acompanhamento do plano de vida.',
    'outras-demandas':'Registrar demandas que não se enquadram em PVIDA ou PTrampo, providências e encaminhamentos realizados.',
    'ptrampo':'Registrar interesses de trabalho e renda, habilidades, experiências, metas, oportunidades e próximos passos.',
    'avaliacao-atividade':'Registrar avaliação sobre acolhimento, conteúdo, metodologia, participação, aprendizados e sugestões.',
    'relatorio-mobilizacao':'Relatar território, objetivo, jovens abordados, interessados, encaminhados, estratégia, parceiros, resultado e próximo passo.',
    'emprestimo':'Registrar bem/equipamento, responsável, retirada, devolução, conservação e assinatura.',
    'emprestimo-canhoto':'Registrar comprovante resumido do empréstimo, datas, item, responsável e assinatura.',
    'cfdh-planejamento':'Registrar tema, objetivo, direitos humanos trabalhados, metodologia, recursos, público esperado e carga horária.',
    'cfdh-avaliacao-jovens':'Avaliação dos jovens sobre tema, metodologia, participação, aprendizados e sugestões.',
    'cfdh-avaliacao-educadores':'Avaliação dos educadores/oficineiros sobre execução, participação, resultados e replanejamentos.',
    'passeio-vivencia':'Registrar objetivo, percurso, transporte, participantes, parceiros, vivências, resultados, ocorrências e evidências.',
    'checklist-evidencias':'Conferir lista de presença, fotos, avaliação, relatório, autorização de imagem, produtos e documentos.',
    'relatorio-oficina-ciclo':'Registrar planejamento, encontros, público, horas, resultados, dificuldades, avaliações, evidências e próximos passos.'
  }[fid]||'Preencher campos conforme o instrumental oficial/sugerido.';
  if(!a)return base;
  return `${base}\n\nATIVIDADE VINCULADA\nNome: ${a.name||''}\nData: ${fmtDate(a.date)}\nHorário: ${a.start||''}${a.end?' às '+a.end:''}\nEducador responsável: ${a.educator||''}\nLocal: ${a.local||''}\nObjetivo: ${a.objectives||''}\nRecursos: ${a.resources||''}\nObservações: ${a.observations||''}`
}
function saveInstrument(){
  const fd=new FormData(document.getElementById('instrumentForm')), f=[...OFFICIAL_FORMS,...SUGGESTED_FORMS].find(x=>x.id===fd.get('fid')), id=fd.get('instrumentId');
  let inst=id?state.instruments.find(x=>x.id===id):null;
  if(inst){Object.assign(inst,{formId:f.id,formName:f.nome,activityId:fd.get('activityId')||'',content:fd.get('content')||'',status:fd.get('status')||'Pendente',date:new Date().toISOString()});logChange('Instrumental atualizado',f.nome)}
  else{inst={id:uid('inst'),formId:f.id,formName:f.nome,activityId:fd.get('activityId')||'',content:fd.get('content')||'',status:fd.get('status')||'Pendente',date:new Date().toISOString()};state.instruments.push(inst);logChange('Instrumental salvo',f.nome)}
  save();closeDrawer();renderInstrumentais();toast('Instrumental salvo e pronto para download no modelo institucional.')
}
function validateInstrument(id){const i=state.instruments.find(x=>x.id===id);if(i){i.status='Validado';i.date=new Date().toISOString()}save();renderInstrumentais()}
function instrumentContext(source){
  const inst=typeof source==='string'?state.instruments.find(x=>x.id===source)||{formId:source,formName:([...OFFICIAL_FORMS,...SUGGESTED_FORMS].find(f=>f.id===source)||{}).nome,activityId:'',content:defaultInstrumentText(source,''),status:'Modelo',date:new Date().toISOString()}:source;
  const form=[...OFFICIAL_FORMS,...SUGGESTED_FORMS].find(f=>f.id===inst.formId)||{id:inst.formId,nome:inst.formName||'Instrumental',tipo:'Oficial',uso:''};
  const activity=state.activities.find(a=>a.id===inst.activityId)||null;
  return {inst,form,activity}
}
function instrumentSections(ctx){
  const {inst,form,activity:a}=ctx, content=inst.content||defaultInstrumentText(form.id,inst.activityId);
  const common=[['Atividade vinculada',a?.name||'Sem atividade vinculada'],['Data e horário',a?`${fmtDate(a.date)} ${a.start||''}${a.end?' às '+a.end:''}`:'A definir'],['Educador responsável',a?.educator||'A definir'],['Local',a?.local||'A definir'],['Meta/etapa',a?metaName(a.metaId)||'Sem vínculo definido':'A definir'],['Status do instrumental',inst.status||'Pendente']];
  const specific={
    'inicial':[['Identificação e acolhimento',content],['Interesses e demandas iniciais',a?.objectives||''],['Encaminhamentos/observações',a?.observations||'']],
    'acompanhamento':[['Demanda acompanhada',a?.objectives||content],['Registro do acompanhamento',content],['Encaminhamentos e retorno',a?.recordObs||a?.observations||'']],
    'pvida':[['Objetivos e possibilidades para a vida',content],['Ações pactuadas',a?.objectives||''],['Rede de apoio/encaminhamentos',a?.observations||'']],
    'outras-demandas':[['Demanda apresentada',content],['Providências realizadas',a?.recordObs||''],['Encaminhamentos',a?.observations||'']],
    'ptrampo':[['Interesses, habilidades e experiências',content],['Possibilidades de trabalho e renda',a?.objectives||''],['Próximos passos',a?.observations||'']],
    'avaliacao-atividade':[['Atividade avaliada',a?.name||''],['Avaliação preenchida',content],['Resultados e sugestões',a?.recordObs||a?.observations||'']],
    'relatorio-mobilizacao':[['Território/local',a?.local||''],['Objetivo da mobilização',a?.objectives||''],['Relato, público abordado e resultados',content],['Próximo passo',a?.observations||'']],
    'emprestimo':[['Item/equipamento emprestado',content],['Responsável e finalidade',a?.educator||''],['Retirada/devolução e conservação','']],
    'emprestimo-canhoto':[['Comprovante do empréstimo',content],['Data e responsável',a?`${fmtDate(a.date)} • ${a.educator||''}`:'']],
    'cfdh-planejamento':[['Tema do CFDH',a?.name||''],['Objetivo',a?.objectives||''],['Direitos humanos, metodologia e conteúdo',content],['Recursos e carga horária',`${a?.resources||''}${a?.start&&a?.end?' • '+hoursBetween(a.start,a.end).toFixed(1)+'h':''}`],['Público esperado',String(a?.expected||'A definir')]],
    'cfdh-avaliacao-jovens':[['Tema/atividade',a?.name||''],['Avaliação dos jovens',content],['Participação e aprendizados',a?.recordObs||''],['Sugestões','']],
    'cfdh-avaliacao-educadores':[['Tema/atividade',a?.name||''],['Avaliação de educadores/oficineiros',content],['Resultados, dificuldades e replanejamento',a?.recordObs||a?.observations||'']],
    'passeio-vivencia':[['Objetivo e roteiro',a?.objectives||''],['Transporte, parceiros e participantes',content],['Resultados/ocorrências',a?.recordObs||a?.observations||'']],
    'checklist-evidencias':[['Checklist preenchido',content],['Evidências vinculadas',a?state.evidences.filter(e=>e.activityId===a.id).map(e=>`${e.type}: ${e.description||e.fileName||''}`).join('\n'):''],['Pendências',a?pendingItems().filter(p=>p.activityId===a.id).map(p=>p.text).join('\n'):'']],
    'relatorio-oficina-ciclo':[['Oficina/ciclo',a?.oficina||a?.name||''],['Planejamento e execução',content],['Resultados e público',a?`Status: ${a.status||''}; Público presente: ${a.present||0}; Objetivo: ${a.objectives||''}`:''],['Evidências e próximos passos',a?.observations||'']]
  }[form.id]||[['Conteúdo preenchido',content]];
  return [...common,...specific]
}
function presenceRows(ctx){
  const aid=ctx.inst.activityId, ps=state.presences.filter(p=>p.activityId===aid);
  if(ps.length)return ps.map((p,i)=>{const y=state.youth.find(x=>x.id===p.youthId);return [String(i+1),y?.name||'Jovem não cadastrado',y?.phone||'',p.present?'Presente':'Ausente','']});
  return Array.from({length:12},(_,i)=>[String(i+1),'','','',''])
}
function instrumentOfficialHTML(source){
  const ctx=instrumentContext(source), sections=instrumentSections(ctx), isPresence=ctx.form.id==='presenca';
  return `<div class="official-doc"><div class="logos">${renderLogos()}</div><table><tr><td class="title" colspan="2">${esc(ctx.form.nome).toUpperCase()}</td></tr><tr><td><b>Tipo:</b> ${esc(ctx.form.tipo)}</td><td><b>Uso:</b> ${esc(ctx.form.uso)}</td></tr></table><br><table>${sections.map(([k,v])=>`<tr><td style="width:27%"><b>${esc(k)}</b></td><td>${nl2br(v||'')}</td></tr>`).join('')}</table>${isPresence?`<br><table><tr><th>Nº</th><th>Nome</th><th>Contato</th><th>Presença</th><th>Assinatura</th></tr>${presenceRows(ctx).map(r=>`<tr>${r.map((v,i)=>`<td style="height:${i===4?'28px':'auto'}">${esc(v)}</td>`).join('')}</tr>`).join('')}</table>`:''}<br><table><tr><td class="sig"><b>Responsável pelo preenchimento</b><br><br>________________________________________</td><td class="sig"><b>Validação/coordenação</b><br><br>________________________________________</td></tr></table><div class="doc-footer">${esc(state.config.orgHeader||'CRJ Cariacica • Secretaria de Estado de Direitos Humanos')} • Documento gerado em ${new Date().toLocaleDateString('pt-BR')}</div></div>`
}
function downloadInstrument(fid){const ctx=instrumentContext(fid);downloadBlob(createOfficialDocxZip(buildInstrumentDocxXml(ctx)),safeName(ctx.form.nome+'_modelo')+'.docx','application/vnd.openxmlformats-officedocument.wordprocessingml.document')}
function printInstrument(fid){const ctx=instrumentContext(fid);printHTML(instrumentOfficialHTML(ctx.inst),safeName(ctx.form.nome+'_modelo'))}
function downloadFilledInstrument(id){const ctx=instrumentContext(id);if(!ctx.inst?.id)return;downloadBlob(createOfficialDocxZip(buildInstrumentDocxXml(ctx)),safeName(ctx.form.nome+'_'+(ctx.activity?.name||'preenchido'))+'.docx','application/vnd.openxmlformats-officedocument.wordprocessingml.document')}
function printFilledInstrument(id){const ctx=instrumentContext(id);if(!ctx.inst?.id)return;printHTML(instrumentOfficialHTML(ctx.inst),safeName(ctx.form.nome+'_'+(ctx.activity?.name||'preenchido')))}
function activityName(id){return state.activities.find(a=>a.id===id)?.name}
function renderRelatorios(){document.getElementById('relatorios').innerHTML=`<div class="grid cols-3"><div class="card"><h3>Relatório mensal geral</h3><p>Planejado, executado, parcial, não realizado, justificativas, público, horas, CFDH, evidências e pendências.</p><button class="btn primary" onclick="generateMonthlyReport()">Gerar relatório</button></div><div class="card"><h3>Relatório por educador</h3><div class="field"><label>Educador</label><select id="reportEducator">${state.config.educators.map(e=>`<option>${esc(e)}</option>`).join('')}</select></div><button class="btn primary" onclick="generateEducatorReport()">Gerar relatório</button></div><div class="card"><h3>Relatório de metas do Termo</h3><p>Comparativo entre metas previstas, realizadas e pendências.</p><button class="btn primary" onclick="generateGoalsReport()">Gerar relatório</button></div></div><div class="card" style="margin-top:16px"><h3>Relatórios gerados</h3>${state.reports.length?state.reports.map(r=>`<div class="model-card"><b>${esc(r.title)}</b><span class="muted">${fmtDateTime(r.date)}</span><div class="actions"><button class="btn small" onclick="downloadReport('${r.id}','docx')">DOCX</button><button class="btn small" onclick="downloadReport('${r.id}','pdf')">PDF</button></div></div>`).join(''):'<div class="empty">Nenhum relatório gerado ainda.</div>'}</div>`}
function reportHTML(title, body){return `<div class="official-doc"><div class="logos">${renderLogos()}</div><h2 style="text-align:center">${esc(title)}</h2>${body}</div>`}
function saveReport(title,html){const r={id:uid('rep'),title,date:new Date().toISOString(),html}; state.reports.unshift(r); logChange('Relatório gerado',title); save(); renderRelatorios(); toast('Relatório gerado.'); return r}
function generateMonthlyReport(){const s=calcStats(); const body=`<table><tr><td><b>Total planejado</b></td><td>${s.total}</td></tr><tr><td><b>Realizadas</b></td><td>${s.realized}</td></tr><tr><td><b>Parciais</b></td><td>${s.partial}</td></tr><tr><td><b>Não realizadas</b></td><td>${s.no}</td></tr><tr><td><b>Presenças</b></td><td>${s.pres}</td></tr><tr><td><b>Horas oficina</b></td><td>${s.hours.toFixed(1)}</td></tr><tr><td><b>Horas CFDH</b></td><td>${s.cfdhHours.toFixed(1)}</td></tr></table><h3>Atividades</h3>${reportActivitiesTable(state.activities)}<h3>Pendências</h3><ul>${pendingItems().map(p=>`<li>${esc(p.text)}</li>`).join('')}</ul>`; saveReport('Relatório Mensal Geral', reportHTML('Relatório Mensal Geral',body))}
function generateEducatorReport(){const ed=document.getElementById('reportEducator').value; const arr=state.activities.filter(a=>String(a.educator||'').includes(ed)); const body=`<p><b>Educador:</b> ${esc(ed)}</p>${reportActivitiesTable(arr)}`; saveReport('Relatório Mensal por Educador — '+ed, reportHTML('Relatório Mensal por Educador',body))}
function generateGoalsReport(){updateMetaRealizado(); const body=`<table><tr><th>Meta</th><th>Indicador</th><th>Previsto</th><th>Realizado</th><th>Status</th></tr>${state.metas.map(m=>`<tr><td>${esc(m.meta)}</td><td>${esc(m.indicador)}</td><td>${esc(m.previsto)}</td><td>${esc(m.realizado)}</td><td>${esc(m.status)}</td></tr>`).join('')}</table>`; saveReport('Relatório de Metas do Termo', reportHTML('Relatório de Metas do Termo',body))}
function generateActivityReport(id){const a=state.activities.find(x=>x.id===id); if(!a)return; const body=`<table><tr><td><b>Atividade</b></td><td>${esc(a.name)}</td></tr><tr><td><b>Tipo</b></td><td>${esc(TYPES[a.type]?.label||a.type)}</td></tr><tr><td><b>Data/Horário</b></td><td>${fmtDate(a.date)} ${esc(a.start||'')} ${a.end?'às '+esc(a.end):''}</td></tr><tr><td><b>Educador</b></td><td>${esc(a.educator||'')}</td></tr><tr><td><b>Meta vinculada</b></td><td>${esc(metaName(a.metaId)||'Sem vínculo')}</td></tr><tr><td><b>Status</b></td><td>${esc(a.status)}</td></tr><tr><td><b>Público presente</b></td><td>${esc(a.present||0)}</td></tr><tr><td><b>Objetivo</b></td><td>${nl2br(a.objectives||'')}</td></tr><tr><td><b>Resultado/registro</b></td><td>${nl2br(a.recordObs||a.occurrence||'')}</td></tr><tr><td><b>Justificativa</b></td><td>${nl2br(a.justification||'')}</td></tr></table>`; const r=saveReport('Relatório Individual — '+a.name, reportHTML('Relatório Individual de Atividade',body)); downloadReport(r.id,'pdf')}
function generateWorkshopReport(name){const arr=state.activities.filter(a=>(a.oficina||a.name)===name); const body=`<p><b>Oficina:</b> ${esc(name)}</p>${reportActivitiesTable(arr)}<h3>Resumo</h3><p>Total de encontros: ${arr.length}. Realizados: ${arr.filter(a=>a.status==='Realizado').length}. Parciais: ${arr.filter(a=>a.status==='Parcial').length}. Não realizados: ${arr.filter(a=>a.status==='Não ocorreu').length}.</p>`; const r=saveReport('Relatório Individual de Oficina — '+name, reportHTML('Relatório Individual de Oficina',body)); closeDrawer(); downloadReport(r.id,'pdf')}
function generateGenericReport(type){const arr=filteredActivities(type); saveReport('Relatório — '+(TYPES[type]?.label||type), reportHTML('Relatório de '+(TYPES[type]?.label||type),reportActivitiesTable(arr)))}
function generateMobilizacaoInstrument(){fillInstrument('relatorio-mobilizacao')}
function generateMonthlyReportFromPanel(){generateMonthlyReport();go('relatorios')}
function reportActivitiesTable(arr){return `<table><tr><th>Data</th><th>Atividade</th><th>Status</th><th>Presente</th><th>Evidências</th></tr>${arr.map(a=>`<tr><td>${fmtDate(a.date)}</td><td>${esc(a.name)}</td><td>${esc(a.status)}</td><td>${esc(a.present||0)}</td><td>${state.evidences.filter(e=>e.activityId===a.id).length}</td></tr>`).join('')}</table>`}
function downloadReport(id,type){const r=state.reports.find(x=>x.id===id); if(!r)return; if(type==='pdf') printHTML(r.html,safeName(r.title)); else downloadBlob(createDocxZip(buildSimpleDocXml(r.title, stripHtml(r.html))), safeName(r.title)+'.docx','application/vnd.openxmlformats-officedocument.wordprocessingml.document')}
function stripHtml(html){const div=document.createElement('div'); div.innerHTML=html; return div.textContent||div.innerText||''}
function renderMetas(){updateMetaRealizado(); document.getElementById('metas').innerHTML=`<div class="card"><h3>Metas do Termo de Colaboração / Plano de Trabalho</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>Meta</th><th>Etapa</th><th>Indicador</th><th>Previsto</th><th>Realizado</th><th>Meio de verificação</th><th>Status</th><th>Ações</th></tr></thead><tbody>${state.metas.map(m=>`<tr><td><b>${esc(m.meta)}</b><br><span class="muted">${esc(m.descricao)}</span></td><td>${esc(m.etapa)}<br><span class="muted">${esc(m.eixo)}</span></td><td>${esc(m.indicador)}</td><td>${esc(m.previsto)}</td><td>${esc(m.realizado||0)}</td><td>${esc(m.meio)}<br><span class="muted">${esc(m.evidencias)}</span></td><td>${statusChip(m.status)}</td><td><button class="btn small" onclick="editMeta('${m.id}')">Editar</button></td></tr>`).join('')}</tbody></table></div></div>`}
function updateMetaRealizado(){state.metas.forEach(m=>{if(m.id==='meta-atendimentos')m.realizado=state.presences.filter(p=>p.present).length; if(m.id==='meta-acompanhamentos')m.realizado=state.records.length; if(m.id==='meta-oficinas')m.realizado=state.activities.filter(a=>a.type==='oficina'&&a.status==='Realizado').reduce((s,a)=>s+hoursBetween(a.start,a.end),0); if(m.id==='meta-cfdh')m.realizado=state.activities.filter(a=>(a.type==='cfdh'||a.cfdh)&&a.status==='Realizado').reduce((s,a)=>s+hoursBetween(a.start,a.end),0); if(m.id==='meta-eventos')m.realizado=state.activities.filter(a=>['evento','mostra','especial'].includes(a.type)&&a.status==='Realizado').length; if(m.id==='meta-vivencias')m.realizado=state.activities.filter(a=>a.type==='passeio'&&a.status==='Realizado').length; if(m.id==='meta-mobilizacao')m.realizado=state.activities.filter(a=>a.type==='mobilizacao'&&a.status==='Realizado').reduce((s,a)=>s+Number(a.present||0),0); if(m.id==='meta-monitoramento')m.realizado=state.reports.length; const pct=Number(m.realizado||0)/Number(m.previsto||1); m.status=pct>=1?'Concluída':pct>=.7?'Em andamento':'Atenção';}); save();}
function editMeta(id){const m=state.metas.find(x=>x.id===id); openDrawer('Editar meta',`<form class="form" id="metaForm" onsubmit="return false"><input type="hidden" name="id" value="${m.id}"><div class="field"><label>Meta</label><input name="meta" value="${esc(m.meta)}"></div><div class="field"><label>Etapa</label><input name="etapa" value="${esc(m.etapa)}"></div><div class="field"><label>Indicador</label><input name="indicador" value="${esc(m.indicador)}"></div><div class="form-row" style="grid-template-columns:1fr 1fr"><div class="field"><label>Previsto</label><input type="number" name="previsto" value="${esc(m.previsto)}"></div><div class="field"><label>Realizado manual</label><input type="number" name="realizado" value="${esc(m.realizado||0)}"></div></div><div class="field"><label>Observações</label><textarea name="obs">${esc(m.obs||'')}</textarea></div><button class="btn primary" onclick="saveMetaEdit()">Salvar meta</button></form>`)}
function saveMetaEdit(){const fd=new FormData(document.getElementById('metaForm')); const m=state.metas.find(x=>x.id===fd.get('id')); Object.assign(m,{meta:fd.get('meta'),etapa:fd.get('etapa'),indicador:fd.get('indicador'),previsto:Number(fd.get('previsto')),realizado:Number(fd.get('realizado')),obs:fd.get('obs')}); save(); closeDrawer(); renderMetas()}
