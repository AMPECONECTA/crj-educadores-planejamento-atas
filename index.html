function evidenceTable(){return state.evidences.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Data</th><th>Tipo</th><th>Atividade</th><th>Responsável</th><th>Descrição/arquivo</th><th>Status</th></tr></thead><tbody>${state.evidences.map(e=>`<tr><td>${fmtDate(e.date)}</td><td>${esc(e.type)}</td><td>${esc(activityName(e.activityId)||'Sem vínculo')}</td><td>${esc(e.responsible||'')}</td><td>${esc(e.description||'')}<br><span class="muted">${esc(e.fileName||'')}</span></td><td>${statusChip(e.status||'Pendente validação')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhuma evidência anexada.</div>'}
function getGithubSyncConfig(){
  const fallback={owner:'CRJCARIACICA',repo:'crj-educadores-planejamento-atas-dados',branch:'main',path:'dados/backup-oficial.json'};
  try{return {...fallback,...JSON.parse(localStorage.getItem(GH_SYNC_CONFIG_KEY)||'{}')}}catch(e){return fallback}
}
function saveGithubSyncConfig(showToast=true){
  const cfg={
    owner:(document.getElementById('ghOwner')?.value||'').trim(),
    repo:(document.getElementById('ghRepo')?.value||'').trim(),
    branch:(document.getElementById('ghBranch')?.value||'main').trim(),
    path:(document.getElementById('ghPath')?.value||'dados/backup-oficial.json').trim()
  };
  localStorage.setItem(GH_SYNC_CONFIG_KEY,JSON.stringify(cfg));
  const token=(document.getElementById('ghToken')?.value||'').trim();
  if(token)sessionStorage.setItem(GH_SYNC_TOKEN_KEY,token);
  if(showToast)toast('Configuração de sincronização salva neste dispositivo.');
  renderGithubSyncStatus();
  return cfg;
}
function getGithubToken(){return sessionStorage.getItem(GH_SYNC_TOKEN_KEY)||''}
function clearGithubToken(){sessionStorage.removeItem(GH_SYNC_TOKEN_KEY);const el=document.getElementById('ghToken');if(el)el.value='';toast('Token removido desta sessão.');renderGithubSyncStatus()}
function githubHeaders(withJson=false){
  const h={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  const token=getGithubToken(); if(token)h.Authorization=`Bearer ${token}`;
  if(withJson)h['Content-Type']='application/json'; return h;
}
function utf8ToBase64(str){const bytes=new TextEncoder().encode(str);let bin='';const step=0x8000;for(let i=0;i<bytes.length;i+=step)bin+=String.fromCharCode(...bytes.subarray(i,i+step));return btoa(bin)}
function base64ToUtf8(b64){const clean=String(b64||'').replace(/\s/g,'');const bin=atob(clean);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder().decode(bytes)}
function githubApiBase(cfg){return `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}`}
async function githubGetRemoteFile(cfg){
  const url=`${githubApiBase(cfg)}/contents/${cfg.path.split('/').map(encodeURIComponent).join('/')}?ref=${encodeURIComponent(cfg.branch||'main')}`;
  const res=await fetch(url,{headers:githubHeaders(false)});
  if(res.status===404)return null;
  if(!res.ok){const body=await res.json().catch(()=>({}));throw new Error(body.message||`GitHub respondeu ${res.status}`)}
  return res.json();
}
async function githubTestConnection(){
  try{
    const cfg=saveGithubSyncConfig(false); if(!cfg.owner||!cfg.repo)throw new Error('Informe proprietário e repositório.');
    const res=await fetch(githubApiBase(cfg),{headers:githubHeaders(false)});
    if(!res.ok){const body=await res.json().catch(()=>({}));throw new Error(body.message||`GitHub respondeu ${res.status}`)}
    const repo=await res.json();
    setGithubSyncMessage(`Conexão confirmada com ${repo.full_name}. Visibilidade: ${repo.private?'privada':'pública'}.`,'ok');
  }catch(e){setGithubSyncMessage(`Falha na conexão: ${e.message}`,'bad')}
}
async function githubPullData(){
  try{
    const cfg=saveGithubSyncConfig(false); if(!getGithubToken())throw new Error('Informe o token de acesso desta sessão.');
    setGithubSyncMessage('Buscando dados no GitHub...','warn');
    const remote=await githubGetRemoteFile(cfg); if(!remote)throw new Error('O arquivo remoto ainda não existe. Faça o primeiro envio deste dispositivo.');
    const parsed=JSON.parse(base64ToUtf8(remote.content));
    const remoteDate=parsed?.meta?.updatedAt?fmtDateTime(parsed.meta.updatedAt):'data não informada';
    const localDate=state?.meta?.updatedAt?fmtDateTime(state.meta.updatedAt):'data não informada';
    if(!confirm(`Baixar os dados do GitHub?\n\nRemoto: ${remoteDate}\nLocal: ${localDate}\n\nOs dados locais serão substituídos.`))return;
    state=migrate(parsed); logChange('Sincronização GitHub','Dados baixados do repositório privado.'); save();
    localStorage.setItem(GH_LAST_SYNC_KEY,JSON.stringify({direction:'download',date:new Date().toISOString(),sha:remote.sha,remoteUpdatedAt:parsed?.meta?.updatedAt||''}));
    renderSection(currentSection); setGithubSyncMessage('Dados baixados e restaurados com sucesso.','ok'); toast('Dados sincronizados a partir do GitHub.');
  }catch(e){setGithubSyncMessage(`Não foi possível baixar: ${e.message}`,'bad')}
}
async function githubPushData(){
  try{
    const cfg=saveGithubSyncConfig(false); if(!getGithubToken())throw new Error('Informe o token de acesso desta sessão.');
    setGithubSyncMessage('Preparando envio para o GitHub...','warn');
    const remote=await githubGetRemoteFile(cfg);
    let remoteState=null;
    if(remote?.content){try{remoteState=JSON.parse(base64ToUtf8(remote.content))}catch(e){}}
    const remoteMs=Date.parse(remoteState?.meta?.updatedAt||0)||0, localMs=Date.parse(state?.meta?.updatedAt||0)||0;
    if(remoteMs>localMs){
      const ok=confirm(`Existe uma versão remota mais recente (${fmtDateTime(remoteState.meta.updatedAt)}).\n\nEnviar mesmo assim e substituir a versão remota?`);
      if(!ok){setGithubSyncMessage('Envio cancelado para evitar sobrescrever dados mais recentes.','warn');return}
    }
    const payload={message:`Backup CRJ — ${new Date().toLocaleString('pt-BR')}`,content:utf8ToBase64(JSON.stringify(state,null,2)),branch:cfg.branch||'main'};
    if(remote?.sha)payload.sha=remote.sha;
    const url=`${githubApiBase(cfg)}/contents/${cfg.path.split('/').map(encodeURIComponent).join('/')}`;
    const res=await fetch(url,{method:'PUT',headers:githubHeaders(true),body:JSON.stringify(payload)});
    if(!res.ok){const body=await res.json().catch(()=>({}));throw new Error(body.message||`GitHub respondeu ${res.status}`)}
    const result=await res.json();
    localStorage.setItem(GH_LAST_SYNC_KEY,JSON.stringify({direction:'upload',date:new Date().toISOString(),sha:result?.content?.sha||'',remoteUpdatedAt:state?.meta?.updatedAt||''}));
    setGithubSyncMessage('Backup enviado ao repositório privado com sucesso.','ok'); toast('Backup salvo no GitHub.');
  }catch(e){setGithubSyncMessage(`Não foi possível enviar: ${e.message}`,'bad')}
}
function setGithubSyncMessage(message,type=''){const el=document.getElementById('ghSyncMessage');if(el){el.textContent=message;el.className=`sync-status ${type}`}}
function renderGithubSyncStatus(){
  const token=!!getGithubToken(); let last=null;try{last=JSON.parse(localStorage.getItem(GH_LAST_SYNC_KEY)||'null')}catch(e){}
  const el=document.getElementById('ghTokenStatus'); if(el)el.innerHTML=`Token nesta aba: <b>${token?'informado':'não informado'}</b>${last?`<br>Última sincronização: ${fmtDateTime(last.date)} (${last.direction==='upload'?'envio':'download'})`:''}`;
}

function xmlEsc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function wRuns(text,{bold=false,size=20,color='',italic=false}={}){const parts=String(text??'').split(/\n/);return parts.map((line,i)=>`${i?'<w:br/>':''}<w:r><w:rPr>${bold?'<w:b/>':''}${italic?'<w:i/>':''}${size?`<w:sz w:val="${size}"/><w:szCs w:val="${size}"/>`:''}${color?`<w:color w:val="${color}"/>`:''}</w:rPr><w:t xml:space="preserve">${xmlEsc(line)}</w:t></w:r>`).join('')}

const APP_FILTER_KEY='crj_global_filter_v3';

function normalizeSearch(value){return String(value??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function defaultFilterMonth(){return todayISO().slice(0,7)}
function loadGlobalFilter(){
  const fallback={month:defaultFilterMonth(),educator:'',query:''};
  try{return {...fallback,...JSON.parse(localStorage.getItem(APP_FILTER_KEY)||'{}')}}catch(e){return fallback}
}
function monthRange(month=globalFilter.month){
  if(!/^\d{4}-\d{2}$/.test(month||''))return {first:'0000-01-01',last:'9999-12-31'};
  const [y,m]=month.split('-').map(Number), lastDay=new Date(y,m,0).getDate();
  return {first:`${y}-${String(m).padStart(2,'0')}-01`,last:`${y}-${String(m).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`};
}
function textMatches(obj,fields){
  const q=normalizeSearch(globalFilter.query); if(!q)return true;
  return fields.some(k=>normalizeSearch(obj?.[k]).includes(q));
}
function educatorMatches(value){const ed=normalizeSearch(globalFilter.educator);return !ed||normalizeSearch(value).includes(ed)}
function dateMatches(date){return !globalFilter.month||String(date||'').slice(0,7)===globalFilter.month}
function activityMatchesGlobalFilter(a){
  return dateMatches(a.date)&&educatorMatches(a.educator)&&textMatches(a,['name','oficina','educator','partner','local','objectives','observations','resources','status']);
}
function planMatchesGlobalFilter(p){
  const {first,last}=monthRange(); const start=p.startDate||p.endDate||'', end=p.endDate||p.startDate||'';
  const dateOK=!globalFilter.month||(!start&&!end)||(String(end||'9999-12-31')>=first&&String(start||'0000-01-01')<=last);
  return dateOK&&educatorMatches(p.educator)&&textMatches(p,['name','turma','educator','partner','eixo','etapa','publico','objetivoGeral','justificativa','observations']);
}
function filteredPlans(){return state.plans.filter(planMatchesGlobalFilter).sort((a,b)=>(a.startDate||'').localeCompare(b.startDate||'')||(a.name||'').localeCompare(b.name||''))}
function filteredEvidences(){return state.evidences.filter(e=>{const a=state.activities.find(x=>x.id===e.activityId);const monthOK=a?dateMatches(a.date):dateMatches(e.date);const edOK=globalFilter.educator?(educatorMatches(e.responsible)||educatorMatches(a?.educator)):true;return monthOK&&edOK&&textMatches({...e,activity:activityName(e.activityId)},['type','responsible','description','fileName','status','activity'])})}

calcStats=function(){const acts=filteredActivities(),ids=new Set(acts.map(a=>a.id));const total=acts.length,realized=acts.filter(a=>a.status==='Realizado').length,partial=acts.filter(a=>a.status==='Parcial').length,no=acts.filter(a=>a.status==='Não ocorreu').length;const hours=acts.filter(a=>a.status==='Realizado').reduce((sum,a)=>sum+hoursBetween(a.start,a.end),0);const cfdhHours=acts.filter(a=>a.type==='cfdh'||a.cfdh).reduce((sum,a)=>sum+(a.status==='Realizado'?hoursBetween(a.start,a.end):0),0);const pres=state.presences.filter(p=>p.present&&ids.has(p.activityId)).length;return{total,realized,partial,no,hours,cfdhHours,pres,pend:pendingItems()}};
pendingItems=function(){const items=[],acts=filteredActivities();acts.forEach(a=>{if(!a.metaId)items.push({level:'danger',text:`${a.name}: sem vínculo com meta`,activityId:a.id});if(a.status==='Realizado'){const ev=state.evidences.filter(e=>e.activityId===a.id),hasPhoto=ev.some(e=>e.type==='Foto'),hasList=state.presences.some(p=>p.activityId===a.id)||ev.some(e=>/presença/i.test((e.type||'')+(e.description||'')));if(!hasList)items.push({level:'warning',text:`${a.name}: realizada sem lista de presença`,activityId:a.id});if(!hasPhoto)items.push({level:'warning',text:`${a.name}: realizada sem foto/evidência visual`,activityId:a.id});if((a.type==='cfdh'||a.cfdh)&&!state.instruments.some(i=>i.activityId===a.id&&/avaliação/i.test(i.formName)))items.push({level:'warning',text:`${a.name}: CFDH sem avaliação vinculada`,activityId:a.id})}if(a.status==='Não ocorreu'&&!a.justification)items.push({level:'danger',text:`${a.name}: não ocorreu sem justificativa`,activityId:a.id});if(a.status==='Parcial'&&!a.justification)items.push({level:'danger',text:`${a.name}: parcial sem explicação`,activityId:a.id})});filteredPlans().forEach(p=>{if(!p.metaId)items.push({level:'danger',text:`Planejamento ${p.name}: sem vínculo com meta`,planId:p.id})});return items};
renderPainel=function(){updateMetaRealizado();const s=calcStats(),acts=filteredActivities(),pct=s.total?Math.round(s.realized/s.total*100):0,ids=new Set(acts.map(a=>a.id)),evidCount=state.evidences.filter(e=>ids.has(e.activityId)||(!e.activityId&&dateMatches(e.date))).length;document.getElementById('painel').innerHTML=`${multiuserWorkflowCard()}<div class="grid cols-4">${kpi('Atividades planejadas',s.total,pct)}${kpi('Realizadas',s.realized,pct,'success')}${kpi('Horas de oficina',s.hours.toFixed(1),Math.min(100,s.hours*2))}${kpi('Horas CFDH',s.cfdhHours.toFixed(1),Math.min(100,s.cfdhHours*5),'purple')}${kpi('Presenças marcadas',s.pres,Math.min(100,s.pres/3.8))}${kpi('Oficinas ativas',new Set(acts.filter(a=>a.type==='oficina').map(a=>a.oficina||a.name)).size,70)}${kpi('Evidências',evidCount,Math.min(100,evidCount*12))}${kpi('Pendências',s.pend.length,Math.min(100,s.pend.length*12),'danger')}</div><div class="grid cols-2" style="margin-top:16px"><div class="card"><h3>Avanço por meta — ${esc(humanMonth())}</h3>${state.metas.map(m=>progressRow(m.meta,m.previsto?Math.round(Number(m.realizado||0)/Number(m.previsto)*100):0,`${m.realizado||0}/${m.previsto||0}`)).join('')}</div><div class="card"><h3>Pendências críticas</h3>${s.pend.length?s.pend.slice(0,9).map(p=>`<div class="notice ${p.level==='danger'?'danger':'warning'}" style="margin-bottom:8px">${esc(p.text)}</div>`).join(''):'<div class="empty">Nenhuma pendência no período filtrado.</div>'}</div></div><div class="grid cols-2" style="margin-top:16px"><div class="card"><h3>Agenda do período</h3>${agendaList(acts.slice(0,10))}</div><div class="card"><h3>Entregas metodológicas</h3><div class="pill-list">${OFFICIAL_FORMS.map(f=>`<span class="chip blue">${esc(f.nome)}</span>`).join('')}</div><p>Todos os indicadores e contadores respeitam o mês, educador e termo de busca selecionados acima.</p></div></div>`};
renderPlanejamento=function(){const plans=filteredPlans();if(!selectedPlanId&&plans[0])selectedPlanId=plans[0].id;let p=plans.find(x=>x.id===selectedPlanId);if(!p&&selectedPlanId==='new')p=blankPlan();if(!p)p=plans[0]||blankPlan();document.getElementById('planejamento').innerHTML=`<div class="split"><div class="card"><h3>Planejamento — ${esc(humanMonth())}</h3><div class="actions" style="margin-bottom:12px"><select onchange="selectedPlanId=this.value;renderPlanejamento()">${plans.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.name||'Sem nome')} • ${esc(x.type)}</option>`).join('')}<option value="new" ${!p.id?'selected':''}>Novo planejamento</option></select><button class="btn primary" onclick="savePlanForm()">Salvar planejamento</button><button class="btn" onclick="newPlan()">Novo</button><button class="btn warning" onclick="autoGenerateLessons()">Gerar aulas</button></div>${plans.length||!p.id?planForm(p):'<div class="empty">Nenhum planejamento no período filtrado.</div>'}</div><div class="card sticky"><h3>Prévia institucional</h3><div class="actions" style="margin-bottom:10px"><button class="btn small" onclick="downloadPlanDOCX()">Baixar DOCX</button><button class="btn small" onclick="printPlanPDF()">Baixar/Imprimir PDF</button><button class="btn small" onclick="createActivitiesFromPlan()">Virar calendário</button></div><div class="doc-preview">${officialPlanHTML(p)}</div></div></div>`};
renderOficinas=function(){const arr=filteredActivities('oficina'),names=[...new Set(arr.map(a=>a.oficina||a.name))];document.getElementById('oficinas').innerHTML=`<div class="card"><div class="actions"><button class="btn primary" onclick="newPlan();go('planejamento')">Novo planejamento de oficina</button><button class="btn" onclick="openQuickNew('oficina')">Nova aula avulsa</button></div></div><div class="grid cols-2" style="margin-top:16px">${names.length?names.map(n=>workshopCard(n)).join(''):'<div class="empty">Nenhuma oficina encontrada com os filtros atuais.</div>'}</div>`};
workshopCard=function(name){const arr=filteredActivities('oficina').filter(a=>(a.oficina||a.name)===name),realized=arr.filter(a=>a.status==='Realizado').length,pend=pendingItems().filter(p=>arr.some(a=>a.id===p.activityId));return `<div class="card"><h3>${esc(name)}</h3><div class="pill-list"><span class="chip blue">${arr.length} encontros</span><span class="chip success">${realized} realizados</span><span class="chip warning">${pend.length} pendências</span></div><p><b>Educadores:</b> ${esc([...new Set(arr.map(a=>a.educator).filter(Boolean))].join(', ')||'Não informado')}</p><p><b>Período:</b> ${esc(humanMonth())}</p><div class="tabs-inline"><button onclick="openWorkshop('${esc(name)}','resumo')">Resumo</button><button onclick="openWorkshop('${esc(name)}','planejamento')">Planejamento</button><button onclick="openWorkshop('${esc(name)}','registros')">Registros</button><button onclick="openWorkshop('${esc(name)}','relatorios')">Relatórios</button></div>${agendaList(arr.slice(0,6))}</div>`};
openWorkshop=function(name,tab){const arr=filteredActivities('oficina').filter(a=>(a.oficina||a.name)===name);openDrawer(`Oficina — ${name}`,`<div class="pill-list"><span class="chip blue">${arr.length} encontros em ${esc(humanMonth())}</span><span class="chip">Aba: ${esc(tab)}</span></div><div class="divider"></div>${agendaList(arr)}<div class="divider"></div><div class="actions"><button class="btn primary" onclick="generateWorkshopReport('${esc(name)}')">Gerar relatório filtrado</button><button class="btn" onclick="go('planejamento');closeDrawer()">Editar planejamento</button></div>`)};
renderCFDH=function(){const arr=filteredActivities().filter(a=>a.type==='cfdh'||a.cfdh);document.getElementById('cfdh').innerHTML=`<div class="grid cols-2"><div class="card"><h3>CFDH transversal</h3><p>Vinculado a oficina, evento ou atividade.</p><button class="btn primary" onclick="openQuickNew('cfdh','transversal')">Novo CFDH transversal</button></div><div class="card"><h3>CFDH estrutural</h3><p>Independente de oficina, com planejamento próprio.</p><button class="btn primary" onclick="openQuickNew('cfdh','estrutural')">Novo CFDH estrutural</button></div></div><div class="card" style="margin-top:16px"><h3>CFDH cadastrados — ${esc(humanMonth())}</h3>${activitiesTable(arr)}</div>`};
renderRegistros=function(){const arr=filteredActivities(),a=arr.find(x=>x.id===selectedActivityId)||arr[0];if(a)selectedActivityId=a.id;document.getElementById('registros').innerHTML=`<div class="split"><div class="card"><h3>Registro em tempo real — ${esc(humanMonth())}</h3><div class="field"><label>Atividade filtrada</label><select onchange="selectedActivityId=this.value;renderRegistros()">${arr.map(x=>`<option value="${x.id}" ${x.id===selectedActivityId?'selected':''}>${fmtDate(x.date)} — ${esc(x.name)}</option>`).join('')}</select></div>${a?recordForm(a):'<div class="empty">Nenhuma atividade no mês/filtro atual.</div>'}</div><div class="card sticky"><h3>Histórico de registros</h3>${recordsList(a?.id)}</div></div>`};
youthTable=function(){const q=normalizeSearch(globalFilter.query),rows=state.youth.filter(y=>!q||normalizeSearch(`${y.name} ${y.phone||''} ${y.obs||''}`).includes(q));return rows.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Jovem</th><th>Contato</th><th>Presenças no mês</th><th>Faltas no mês</th><th>Ações</th></tr></thead><tbody>${rows.map(y=>{const ps=state.presences.filter(p=>p.youthId===y.id&&presenceMatchesGlobalFilter(p)),pres=ps.filter(p=>p.present).length,abs=ps.filter(p=>!p.present).length;return `<tr><td><b>${esc(y.name)}</b><br><span class="muted">${esc(y.obs||'')}</span></td><td>${esc(y.phone||'')}</td><td>${pres}</td><td>${abs}</td><td><button class="btn small" onclick="downloadPresenceForYouth('${y.id}')">Exportar ficha</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Nenhum jovem encontrado.</div>'};
absenceAlerts=function(){const rows=state.youth.map(y=>({y,abs:state.presences.filter(p=>p.youthId===y.id&&!p.present&&presenceMatchesGlobalFilter(p)).length})).filter(x=>x.abs>=3);return rows.length?rows.map(x=>`<div class="notice warning" style="margin-bottom:8px">${esc(x.y.name)} com ${x.abs} faltas em ${esc(humanMonth())}.</div>`).join(''):'<div class="empty">Sem alerta de evasão no mês selecionado.</div>'};
renderJovens=function(){document.getElementById('jovens').innerHTML=`<div class="grid cols-2"><div class="card"><h3>Cadastrar jovem</h3><form class="form" id="youthForm" onsubmit="return false"><div class="field"><label>Nome</label><input name="name"></div><div class="field"><label>Contato</label><input name="phone"></div><div class="field"><label>Observação interna</label><textarea name="obs"></textarea></div><button class="btn primary" onclick="saveYouth()">Salvar jovem</button></form></div><div class="card"><h3>Alertas de frequência — ${esc(humanMonth())}</h3>${absenceAlerts()}</div></div><div class="card" style="margin-top:16px"><h3>Jovens e presenças no período</h3>${youthTable()}</div>`};
renderInstrumentais=function(){const forms=[...OFFICIAL_FORMS,...SUGGESTED_FORMS],filled=filteredInstruments();document.getElementById('instrumentais').innerHTML=`<div class="split"><div class="card"><h3>Instrumentais da Metodologia</h3><p class="muted">Os modelos vazios permanecem disponíveis. Os instrumentais preenchidos à direita respeitam o filtro mensal e de busca.</p><div class="table-wrap"><table class="data-table"><thead><tr><th>Instrumental</th><th>Tipo</th><th>Uso</th><th>Ações</th></tr></thead><tbody>${forms.filter(f=>!globalFilter.query||normalizeSearch(`${f.nome} ${f.uso}`).includes(normalizeSearch(globalFilter.query))).map(f=>`<tr><td><b>${esc(f.nome)}</b></td><td>${f.tipo==='Oficial'?'<span class="chip blue">Oficial</span>':'<span class="chip warning">Sugerido</span>'}</td><td>${esc(f.uso)}</td><td><div class="instrument-actions"><button class="btn small primary" onclick="fillInstrument('${f.id}')">Preencher</button><button class="btn small" onclick="downloadInstrument('${f.id}')">Modelo DOCX</button><button class="btn small" onclick="printInstrument('${f.id}')">Modelo PDF</button></div></td></tr>`).join('')}</tbody></table></div></div><div class="card sticky"><h3>Preenchidos — ${esc(humanMonth())}</h3>${filled.length?filled.map(i=>`<div class="model-card"><div class="instrument-status"><div><b>${esc(i.formName)}</b><br><span>${esc(activityName(i.activityId)||'Sem atividade')}</span><br><span class="muted">${fmtDateTime(i.date)}</span></div>${statusChip(i.status)}</div><div class="instrument-actions"><button class="btn small" onclick="fillInstrument('${i.formId}','${i.id}')">Editar</button><button class="btn small primary" onclick="downloadFilledInstrument('${i.id}')">DOCX preenchido</button><button class="btn small" onclick="printFilledInstrument('${i.id}')">PDF preenchido</button><button class="btn small success" onclick="validateInstrument('${i.id}')">Validar</button></div></div>`).join(''):'<div class="empty">Nenhum instrumental preenchido no filtro atual.</div>'}</div></div>`};
const originalFillInstrumentMulti=fillInstrument;
fillInstrument=function(fid,instrumentId=''){const f=[...OFFICIAL_FORMS,...SUGGESTED_FORMS].find(x=>x.id===fid),existing=instrumentId?state.instruments.find(x=>x.id===instrumentId):null,opts=filteredActivities().map(a=>`<option value="${a.id}" ${existing?.activityId===a.id?'selected':''}>${fmtDate(a.date)} — ${esc(a.name)}</option>`).join(''),initialContent=existing?.content||defaultInstrumentText(fid,existing?.activityId||'');openDrawer(existing?'Editar instrumental':'Preencher instrumental',`<form class="form" id="instrumentForm" onsubmit="return false"><input type="hidden" name="fid" value="${fid}"><input type="hidden" name="instrumentId" value="${esc(instrumentId)}"><div class="field"><label>Instrumental</label><input value="${esc(f.nome)}" disabled></div><div class="field"><label>Atividade vinculada — ${esc(humanMonth())}</label><select name="activityId" onchange="prefillInstrumentContent('${fid}',this.value)"><option value="">Sem atividade</option>${opts}</select></div><div class="field"><label>Conteúdo / observações editáveis</label><textarea name="content" id="instrumentContent">${esc(initialContent)}</textarea></div><div class="field"><label>Status</label><select name="status"><option ${existing?.status==='Pendente'?'selected':''}>Pendente</option><option ${existing?.status==='Preenchido'?'selected':''}>Preenchido</option><option ${existing?.status==='Validado'?'selected':''}>Validado</option></select></div><div class="notice">O arquivo baixado seguirá o modelo institucional com cabeçalho, tabelas, bordas, assinatura e rodapé.</div><button class="btn primary" onclick="saveInstrument()">Salvar instrumental</button></form>`)};
saveReport=function(title,html,extra={}){const r={id:uid('rep'),title,date:new Date().toISOString(),periodMonth:globalFilter.month,generatedBy:currentEditor,html,...extra};state.reports.unshift(r);logChange('Relatório gerado',`${title} • ${humanMonth()}`);save();renderRelatorios();toast('Relatório gerado para '+humanMonth()+'.');return r};
generateMonthlyReport=function(){const s=calcStats(),arr=filteredActivities();const body=`<p><b>Período:</b> ${esc(humanMonth())}</p><p><b>Filtro de educador:</b> ${esc(globalFilter.educator||'Todos')}</p><table><tr><td><b>Total planejado</b></td><td>${s.total}</td></tr><tr><td><b>Realizadas</b></td><td>${s.realized}</td></tr><tr><td><b>Parciais</b></td><td>${s.partial}</td></tr><tr><td><b>Não realizadas</b></td><td>${s.no}</td></tr><tr><td><b>Presenças</b></td><td>${s.pres}</td></tr><tr><td><b>Horas oficina</b></td><td>${s.hours.toFixed(1)}</td></tr><tr><td><b>Horas CFDH</b></td><td>${s.cfdhHours.toFixed(1)}</td></tr></table><h3>Atividades</h3>${reportActivitiesTable(arr)}<h3>Pendências</h3><ul>${pendingItems().map(p=>`<li>${esc(p.text)}</li>`).join('')}</ul>`;saveReport(`Relatório Mensal Geral — ${humanMonth()}`,reportHTML(`Relatório Mensal Geral — ${humanMonth()}`,body))};
generateEducatorReport=function(){const ed=document.getElementById('reportEducator').value,arr=state.activities.filter(a=>activityMatchesGlobalFilter(a)&&normalizeSearch(a.educator).includes(normalizeSearch(ed)));const body=`<p><b>Educador:</b> ${esc(ed)}</p><p><b>Período:</b> ${esc(humanMonth())}</p>${reportActivitiesTable(arr)}`;saveReport(`Relatório Mensal por Educador — ${ed} — ${humanMonth()}`,reportHTML('Relatório Mensal por Educador',body),{educator:ed})};
generateWorkshopReport=function(name){const arr=filteredActivities('oficina').filter(a=>(a.oficina||a.name)===name),body=`<p><b>Oficina:</b> ${esc(name)}</p><p><b>Período:</b> ${esc(humanMonth())}</p>${reportActivitiesTable(arr)}<h3>Resumo</h3><p>Total de encontros: ${arr.length}. Realizados: ${arr.filter(a=>a.status==='Realizado').length}. Parciais: ${arr.filter(a=>a.status==='Parcial').length}. Não realizados: ${arr.filter(a=>a.status==='Não ocorreu').length}.</p>`,r=saveReport(`Relatório Individual de Oficina — ${name} — ${humanMonth()}`,reportHTML('Relatório Individual de Oficina',body));closeDrawer();downloadReport(r.id,'pdf')};
renderRelatorios=function(){const reports=filteredReports();document.getElementById('relatorios').innerHTML=`<div class="grid cols-3"><div class="card"><h3>Relatório mensal geral</h3><p>Período ativo: <b>${esc(humanMonth())}</b>.</p><button class="btn primary" onclick="generateMonthlyReport()">Gerar relatório</button></div><div class="card"><h3>Relatório por educador</h3><div class="field"><label>Educador</label><select id="reportEducator">${state.config.educators.map(e=>`<option ${globalFilter.educator===e?'selected':''}>${esc(e)}</option>`).join('')}</select></div><button class="btn primary" onclick="generateEducatorReport()">Gerar relatório</button></div><div class="card"><h3>Relatório de metas</h3><p>Comparativo do mês e filtros ativos.</p><button class="btn primary" onclick="generateGoalsReport()">Gerar relatório</button></div></div><div class="card" style="margin-top:16px"><h3>Relatórios gerados — ${esc(humanMonth())}</h3>${reports.length?reports.map(r=>`<div class="model-card"><b>${esc(r.title)}</b><span class="muted">${fmtDateTime(r.date)} • gerado por ${esc(r.generatedBy||'não identificado')}</span><div class="actions"><button class="btn small" onclick="downloadReport('${r.id}','docx')">DOCX</button><button class="btn small" onclick="downloadReport('${r.id}','pdf')">PDF</button></div></div>`).join(''):'<div class="empty">Nenhum relatório no filtro atual.</div>'}</div>`};
updateMetaRealizado=function(){const acts=filteredActivities(),ids=new Set(acts.map(a=>a.id));state.metas.forEach(m=>{if(m.id==='meta-atendimentos')m.realizado=state.presences.filter(p=>p.present&&ids.has(p.activityId)).length;if(m.id==='meta-acompanhamentos')m.realizado=state.records.filter(recordMatchesGlobalFilter).length;if(m.id==='meta-oficinas')m.realizado=acts.filter(a=>a.type==='oficina'&&a.status==='Realizado').reduce((s,a)=>s+hoursBetween(a.start,a.end),0);if(m.id==='meta-cfdh')m.realizado=acts.filter(a=>(a.type==='cfdh'||a.cfdh)&&a.status==='Realizado').reduce((s,a)=>s+hoursBetween(a.start,a.end),0);if(m.id==='meta-eventos')m.realizado=acts.filter(a=>['evento','mostra','especial'].includes(a.type)&&a.status==='Realizado').length;if(m.id==='meta-vivencias')m.realizado=acts.filter(a=>a.type==='passeio'&&a.status==='Realizado').length;if(m.id==='meta-mobilizacao')m.realizado=acts.filter(a=>a.type==='mobilizacao'&&a.status==='Realizado').reduce((s,a)=>s+Number(a.present||0),0);if(m.id==='meta-monitoramento')m.realizado=filteredReports().length;const pct=Number(m.realizado||0)/Number(m.previsto||1);m.status=pct>=1?'Concluída':pct>=.7?'Em andamento':'Atenção'})};

/* Sincronização: identificação, histórico e proteção contra sobrescrita */
const originalGithubPushDataMulti=githubPushData;
githubPushData=async function(){
  try{
    const cfg=saveGithubSyncConfig(false);if(!getGithubToken())throw new Error('Informe o token de acesso desta sessão.');
    setGithubSyncMessage('Conferindo a versão oficial antes do envio...','warn');
    const remote=await githubGetRemoteFile(cfg);let remoteState=null;if(remote?.content){try{remoteState=JSON.parse(base64ToUtf8(remote.content))}catch(e){}}
    const remoteMs=Date.parse(remoteState?.meta?.updatedAt||0)||0,localMs=Date.parse(state?.meta?.updatedAt||0)||0;
    const last=(()=>{try{return JSON.parse(localStorage.getItem(GH_LAST_SYNC_KEY)||'null')}catch(e){return null}})();
    if(remoteMs>localMs||remote?.sha&&(last?.sha&&last.sha!==remote.sha&&last.direction!=='download')){
      setGithubSyncMessage(`Envio bloqueado: ${remoteState?.meta?.lastEditor||'outro educador'} atualizou o arquivo oficial em ${fmtDateTime(remoteState?.meta?.updatedAt)}. Baixe a versão mais recente antes de continuar.`,'bad');
      alert('Existe uma versão mais recente no GitHub. Para evitar perder o trabalho de outro educador, o envio foi bloqueado.\n\n1. Exporte seu backup local por segurança.\n2. Baixe os dados do GitHub.\n3. Reaplique somente suas alterações necessárias.\n4. Envie novamente.');
      return;
    }
    state.meta.lastEditor=currentEditor;state.meta.lastEditorAt=new Date().toISOString();state.meta.updatedAt=state.meta.lastEditorAt;
    const payload={message:`Backup CRJ — ${currentEditor} — ${new Date().toLocaleString('pt-BR')}`,content:utf8ToBase64(JSON.stringify(state,null,2)),branch:cfg.branch||'main'};if(remote?.sha)payload.sha=remote.sha;
    const url=`${githubApiBase(cfg)}/contents/${cfg.path.split('/').map(encodeURIComponent).join('/')}`,res=await fetch(url,{method:'PUT',headers:githubHeaders(true),body:JSON.stringify(payload)});
    if(!res.ok){const body=await res.json().catch(()=>({}));throw new Error(body.message||`GitHub respondeu ${res.status}`)}
    const result=await res.json();localStorage.setItem(GH_LAST_SYNC_KEY,JSON.stringify({direction:'upload',date:new Date().toISOString(),sha:result?.content?.sha||'',remoteUpdatedAt:state.meta.updatedAt,editor:currentEditor}));
    setGithubSyncMessage(`Backup de ${currentEditor} enviado com sucesso.`,'ok');renderGlobalFilters();toast('Backup salvo no GitHub.');
  }catch(e){setGithubSyncMessage(`Não foi possível enviar: ${e.message}`,'bad')}
};

renderBackup=function(){originalRenderBackupMulti();const first=document.querySelector('#backup .grid.cols-2 .card');if(first)first.insertAdjacentHTML('afterbegin',multiuserWorkflowCard());document.querySelectorAll('#backup .model-card').forEach((card,idx)=>{const log=state.changeLog[idx];if(log?.user)card.insertAdjacentHTML('beforeend',`<span class="history-user">Responsável: ${esc(log.user)}</span>`)});const card=document.getElementById('githubSyncCard');if(card)card.insertAdjacentHTML('beforeend',`<div class="conflict-warning"><b>Sem banco externo não há edição simultânea.</b> O sistema bloqueia o envio quando identifica uma versão remota mais recente. Cada educador deve baixar antes de editar e enviar imediatamente após concluir.</div>`);renderGlobalFilters()};

function ensureBrainstorms(){if(!Array.isArray(state.brainstorms))state.brainstorms=[];return state.brainstorms}
function brainDate(b){return String(b?.date||b?.createdAt||'').slice(0,10)}
function filteredBrainstorms(){
  return ensureBrainstorms().filter(b=>{
    const monthOK=dateMatches(brainDate(b));
    const edText=[b.facilitator,b.createdBy,b.updatedBy,b.participants,(b.ideas||[]).map(i=>i.author).join(' ')].join(' ');
    const edOK=!globalFilter.educator||educatorMatches(edText);
    const searchable={...b,ideasText:(b.ideas||[]).map(i=>`${i.text} ${i.category} ${i.author} ${i.status}`).join(' '),actionsText:(b.actions||[]).map(a=>`${a.task} ${a.responsible} ${a.status}`).join(' ')};
    return monthOK&&edOK&&textMatches(searchable,['title','kind','facilitator','participants','objective','agenda','notes','tags','decisions','pending','insights','ideasText','actionsText']);
  }).sort((a,b)=>(brainDate(b)||'').localeCompare(brainDate(a)||'')||(b.updatedAt||'').localeCompare(a.updatedAt||''));
}

function saveBrainstormDetails(id){const b=brainById(id),f=document.getElementById('brainDetailsForm');if(!b||!f)return;const fd=new FormData(f);['title','date','time','kind','facilitator','participants','objective','agenda','notes','decisions','pending','nextMeeting','tags','status'].forEach(k=>b[k]=fd.get(k)||'');b.updatedBy=currentEditor;b.updatedAt=new Date().toISOString();logChange('Reunião atualizada',b.title);save();renderIdeias();openBrainstorm(id);toast('Reunião salva.')}
function addBrainIdea(id){const b=brainById(id),f=document.getElementById('brainIdeaForm');if(!b||!f||!f.reportValidity())return;const fd=new FormData(f);b.ideas=b.ideas||[];b.ideas.unshift({id:uid('idea'),text:fd.get('text').trim(),category:fd.get('category'),author:fd.get('author')||currentEditor,priority:fd.get('priority')||'Média',status:'Rascunho',votes:0,createdAt:new Date().toISOString()});b.updatedBy=currentEditor;b.updatedAt=new Date().toISOString();logChange('Ideia adicionada',`${b.title}: ${fd.get('text').trim().slice(0,80)}`);save();renderIdeias();openBrainstorm(id)}
function brainIdeaCard(bid,i){return `<div class="idea-note priority-${normalizeSearch(i.priority)}"><div class="idea-text">${nl2br(i.text)}</div><div class="brain-meta"><span>${esc(i.category||'Outro')}</span><span>${esc(i.author||'')}</span><span>Prioridade ${esc(i.priority||'Média')}</span><span>${esc(i.status||'Rascunho')}</span><span>${Number(i.votes||0)} apoio(s)</span></div><div class="actions"><button class="btn small" onclick="voteBrainIdea('${bid}','${i.id}')">Apoiar +1</button><button class="btn small warning" onclick="setBrainIdeaStatus('${bid}','${i.id}','Priorizada')">Priorizar</button><button class="btn small success" onclick="setBrainIdeaStatus('${bid}','${i.id}','Aprovada')">Aprovar</button><button class="btn small" onclick="editBrainIdea('${bid}','${i.id}')">Editar</button><button class="btn small danger" onclick="removeBrainIdea('${bid}','${i.id}')">Remover</button></div></div>`}
function voteBrainIdea(bid,iid){const b=brainById(bid),i=(b?.ideas||[]).find(x=>x.id===iid);if(!i)return;i.votes=Number(i.votes||0)+1;b.updatedAt=new Date().toISOString();save();renderIdeias();openBrainstorm(bid)}
function setBrainIdeaStatus(bid,iid,status){const b=brainById(bid),i=(b?.ideas||[]).find(x=>x.id===iid);if(!i)return;i.status=status;b.updatedBy=currentEditor;b.updatedAt=new Date().toISOString();save();renderIdeias();openBrainstorm(bid)}
function editBrainIdea(bid,iid){const b=brainById(bid),i=(b?.ideas||[]).find(x=>x.id===iid);if(!i)return;openDrawer('Editar ideia',`<form class="form" id="editIdeaForm" onsubmit="return false"><div class="field"><label>Texto</label><textarea name="text">${esc(i.text)}</textarea></div><div class="form-row"><div class="field"><label>Categoria</label><input name="category" value="${esc(i.category||'')}"></div><div class="field"><label>Autor(a)</label><input name="author" value="${esc(i.author||'')}"></div><div class="field"><label>Prioridade</label><select name="priority">${['Baixa','Média','Alta'].map(x=>`<option ${i.priority===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Status</label><select name="status">${['Rascunho','Em análise','Priorizada','Aprovada','Arquivada'].map(x=>`<option ${i.status===x?'selected':''}>${x}</option>`).join('')}</select></div></div><button class="btn primary" onclick="saveBrainIdeaEdit('${bid}','${iid}')">Salvar ideia</button></form>`)}
function saveBrainIdeaEdit(bid,iid){const b=brainById(bid),i=(b?.ideas||[]).find(x=>x.id===iid),f=document.getElementById('editIdeaForm');if(!i||!f)return;const fd=new FormData(f);['text','category','author','priority','status'].forEach(k=>i[k]=fd.get(k)||'');b.updatedBy=currentEditor;b.updatedAt=new Date().toISOString();save();renderIdeias();openBrainstorm(bid)}
function removeBrainIdea(bid,iid){const b=brainById(bid);if(!b||!confirm('Remover esta ideia?'))return;b.ideas=(b.ideas||[]).filter(i=>i.id!==iid);b.updatedAt=new Date().toISOString();save();renderIdeias();openBrainstorm(bid)}
function addBrainAction(id){const b=brainById(id),f=document.getElementById('brainActionForm');if(!b||!f||!f.reportValidity())return;const fd=new FormData(f);b.actions=b.actions||[];b.actions.push({id:uid('action'),task:fd.get('task').trim(),responsible:fd.get('responsible')||currentEditor,due:fd.get('due')||'',status:fd.get('status')||'Pendente'});b.updatedBy=currentEditor;b.updatedAt=new Date().toISOString();save();renderIdeias();openBrainstorm(id)}
function brainActionCard(bid,a){return `<div class="model-card"><b>${esc(a.task)}</b><span>Responsável: ${esc(a.responsible||'')} ${a.due?'• prazo '+fmtDate(a.due):''}</span><div class="actions"><select onchange="setBrainActionStatus('${bid}','${a.id}',this.value)">${['Pendente','Em andamento','Concluído'].map(x=>`<option ${a.status===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn small danger" onclick="removeBrainAction('${bid}','${a.id}')">Excluir</button></div></div>`}
function setBrainActionStatus(bid,aid,status){const b=brainById(bid),a=(b?.actions||[]).find(x=>x.id===aid);if(!a)return;a.status=status;b.updatedBy=currentEditor;b.updatedAt=new Date().toISOString();save();renderIdeias();openBrainstorm(bid)}
function removeBrainAction(bid,aid){const b=brainById(bid);if(!b||!confirm('Excluir este encaminhamento?'))return;b.actions=(b.actions||[]).filter(a=>a.id!==aid);save();renderIdeias();openBrainstorm(bid)}
function brainTopThemes(b){const stop=new Set('a o as os de da do das dos e em para por com um uma que se no na nos nas ao aos ou como mais menos ser foi são esta este essa esse sobre entre sua seu suas seus isso isto pela pelo pelas pelos também já ainda até cada quando onde quem qual quais deve devem'.split(' '));const raw=[b.title,b.objective,b.agenda,b.notes,b.decisions,b.pending,(b.ideas||[]).map(i=>i.text+' '+i.category).join(' ')].join(' ');const words=normalizeSearch(raw).replace(/[^a-z0-9áéíóúâêôãõç ]/g,' ').split(/\s+/).filter(w=>w.length>3&&!stop.has(w));const count={};words.forEach(w=>count[w]=(count[w]||0)+1);return Object.entries(count).sort((a,b)=>b[1]-a[1]).slice(0,7).map(([w,n])=>`${w} (${n})`)}
function generateBrainInsights(id,show=true){const b=brainById(id);if(!b)return'';const ideas=b.ideas||[],actions=b.actions||[],cats={};ideas.forEach(i=>cats[i.category||'Outro']=(cats[i.category||'Outro']||0)+1);const categoryText=Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k}: ${v}`).join('; ')||'nenhuma categoria registrada';const themes=brainTopThemes(b);const topIdeas=[...ideas].sort((a,b)=>(Number(b.votes||0)-Number(a.votes||0))||(['Alta','Média','Baixa'].indexOf(a.priority)-['Alta','Média','Baixa'].indexOf(b.priority))).filter(i=>['Priorizada','Aprovada'].includes(i.status)||i.priority==='Alta'||Number(i.votes||0)>0).slice(0,6);const open=actions.filter(a=>a.status!=='Concluído');const lines=[`INSIGHTS AUTOMÁTICOS - ${b.title}`,`Temas recorrentes: ${themes.join(', ')||'ainda não há texto suficiente para identificar recorrências.'}`,`Distribuição das ideias: ${categoryText}.`,`Propostas com maior sinal de prioridade: ${topIdeas.length?topIdeas.map(i=>`${i.text} [${i.status}; ${i.priority}; ${i.votes||0} apoio(s)]`).join(' | '):'nenhuma proposta priorizada.'}`,`Decisões registradas: ${b.decisions?.trim()?b.decisions.trim():'nenhuma decisão formal registrada.'}`,`Encaminhamentos abertos: ${open.length?open.map(a=>`${a.task} - ${a.responsible||'sem responsável'}${a.due?' até '+fmtDate(a.due):''}`).join(' | '):'nenhum encaminhamento em aberto.'}`,`Questões que exigem retomada: ${b.pending?.trim()?b.pending.trim():'nenhuma pendência declarada.'}`,`Leitura para a próxima etapa: consolidar as ideias aprovadas, definir responsáveis e prazos e verificar como cada encaminhamento se conecta às metas, oficinas, CFDH, mobilização ou programação do mês.`];b.insights=lines.join('\n\n');b.updatedBy=currentEditor;b.updatedAt=new Date().toISOString();logChange('Insights gerados',b.title);save();renderIdeias();if(show)openBrainstorm(id);return b.insights}
function listLines(value){return String(value||'').split(/\n|;/).map(x=>x.trim()).filter(Boolean)}
function buildBrainMinutesHTML(b){if(!b.insights)generateBrainInsights(b.id,false);const ideas=b.ideas||[],actions=b.actions||[];const ideaRows=ideas.length?ideas.map((i,n)=>`<tr><td>${n+1}</td><td>${nl2br(i.text)}</td><td>${esc(i.category||'')}</td><td>${esc(i.author||'')}</td><td>${esc(i.priority||'')}</td><td>${esc(i.status||'')}</td></tr>`).join(''):'<tr><td colspan="6">Nenhuma ideia registrada.</td></tr>';const actionRows=actions.length?actions.map((a,n)=>`<tr><td>${n+1}</td><td>${nl2br(a.task)}</td><td>${esc(a.responsible||'')}</td><td>${a.due?fmtDate(a.due):''}</td><td>${esc(a.status||'')}</td></tr>`).join(''):'<tr><td colspan="5">Nenhum encaminhamento registrado.</td></tr>';return `<div class="official-doc"><div class="logos">${renderLogos()}</div><table><tr><td class="title" colspan="2">ATA DE REUNIÃO E SISTEMATIZAÇÃO DE IDEIAS</td></tr><tr><td><b>CRJ:</b> ${esc(state.config.crjName||'CRJ Cariacica')}</td><td><b>Tipo:</b> ${esc(b.kind||'Reunião')}</td></tr><tr><td><b>Data:</b> ${fmtDate(brainDate(b))}</td><td><b>Horário:</b> ${esc(b.time||'')}</td></tr><tr><td><b>Facilitador(a):</b> ${esc(b.facilitator||'')}</td><td><b>Elaboração:</b> ${esc(currentEditor)}</td></tr></table><br><table><tr><td><b>Participantes</b></td></tr><tr><td>${nl2br(b.participants||'Não informado')}</td></tr><tr><td><b>Objetivo do encontro</b></td></tr><tr><td>${nl2br(b.objective||'Não informado')}</td></tr><tr><td><b>Pauta</b></td></tr><tr><td>${nl2br(b.agenda||'Não informada')}</td></tr><tr><td><b>Pontos discutidos e anotações</b></td></tr><tr><td>${nl2br(b.notes||'Não informado')}</td></tr></table><br><table><tr><th>Nº</th><th>Ideia/proposta</th><th>Categoria</th><th>Autor(a)</th><th>Prioridade</th><th>Situação</th></tr>${ideaRows}</table><br><table><tr><td><b>Decisões tomadas</b></td></tr><tr><td>${nl2br(b.decisions||'Nenhuma decisão formal registrada.')}</td></tr><tr><td><b>Insights e síntese analítica</b></td></tr><tr><td>${nl2br(b.insights||'')}</td></tr><tr><td><b>Pendências</b></td></tr><tr><td>${nl2br(b.pending||'Nenhuma pendência registrada.')}</td></tr></table><br><table><tr><th>Nº</th><th>Encaminhamento</th><th>Responsável</th><th>Prazo</th><th>Status</th></tr>${actionRows}</table><br><table><tr><td><b>Próxima reunião ou marco de acompanhamento</b></td></tr><tr><td>${nl2br(b.nextMeeting||'A definir')}</td></tr></table><br><table><tr><td class="sig"><b>Responsável pela ata</b><br><br>________________________________________<br>${esc(currentEditor)}</td><td class="sig"><b>Validação da equipe/coordenação</b><br><br>________________________________________</td></tr></table><div class="doc-footer">${esc(state.config.orgHeader||'CRJ Cariacica • Secretaria de Estado de Direitos Humanos')} • Ata gerada em ${new Date().toLocaleDateString('pt-BR')}</div></div>`}
function ensureBrainMinutesReport(id){const b=brainById(id);if(!b)return null;generateBrainInsights(id,false);const html=buildBrainMinutesHTML(b);let r=b.minutesReportId?state.reports.find(x=>x.id===b.minutesReportId):null;if(!r){r={id:uid('rep'),title:`Ata - ${b.title} - ${fmtDate(brainDate(b))}`,date:new Date().toISOString(),periodMonth:brainDate(b).slice(0,7),generatedBy:currentEditor,educator:b.facilitator,kind:'Ata de reunião',brainstormId:b.id,html};state.reports.unshift(r);b.minutesReportId=r.id}else{Object.assign(r,{title:`Ata - ${b.title} - ${fmtDate(brainDate(b))}`,date:new Date().toISOString(),periodMonth:brainDate(b).slice(0,7),generatedBy:currentEditor,educator:b.facilitator,html})}if(!state.evidences.some(e=>e.brainstormId===b.id&&e.type==='Ata'))state.evidences.unshift({id:uid('ev'),brainstormId:b.id,activityId:'',date:brainDate(b),type:'Ata',responsible:currentEditor,description:`Ata gerada a partir da sessão: ${b.title}`,fileName:'Ata disponível em Relatórios e Anexos',status:'Preenchido'});b.updatedBy=currentEditor;b.updatedAt=new Date().toISOString();logChange('Ata gerada',b.title);save();return r}
function generateBrainMinutes(id,preview=true){const r=ensureBrainMinutesReport(id);if(!r)return;renderIdeias();if(preview)openDrawer(r.title,`<div class="actions"><button class="btn primary" onclick="downloadReport('${r.id}','docx')">Baixar DOCX</button><button class="btn" onclick="downloadReport('${r.id}','pdf')">Baixar PDF</button></div><div class="minutes-preview" style="margin-top:12px">${r.html}</div>`);toast('Ata gerada e salva em Relatórios e Anexos.')}
function downloadBrainMinutes(id,type){const r=ensureBrainMinutesReport(id);if(r)downloadReport(r.id,type)}
function generateBrainstormMonthlyReport(){const rows=filteredBrainstorms();const html=`<div class="official-doc"><div class="logos">${renderLogos()}</div><table><tr><td class="title">RELATÓRIO MENSAL DE REUNIÕES, IDEIAS E ENCAMINHAMENTOS</td></tr><tr><td><b>Período:</b> ${esc(humanMonth())} • <b>Filtro:</b> ${esc(currentFilterDescription())}</td></tr></table><br><table><tr><th>Data</th><th>Reunião</th><th>Facilitação</th><th>Ideias</th><th>Decisões</th><th>Encaminhamentos abertos</th></tr>${rows.length?rows.map(b=>`<tr><td>${fmtDate(brainDate(b))}</td><td>${esc(b.title)}<br><span>${esc(b.kind||'')}</span></td><td>${esc(b.facilitator||'')}</td><td>${(b.ideas||[]).length}</td><td>${nl2br(b.decisions||'')}</td><td>${(b.actions||[]).filter(a=>a.status!=='Concluído').map(a=>esc(a.task)).join('<br>')}</td></tr>`).join(''):'<tr><td colspan="6">Nenhum encontro no período.</td></tr>'}</table><div class="doc-footer">${esc(state.config.orgHeader||'CRJ Cariacica')} • Gerado por ${esc(currentEditor)} em ${new Date().toLocaleDateString('pt-BR')}</div></div>`;const r={id:uid('rep'),title:`Relatório de reuniões e ideias - ${humanMonth()}`,date:new Date().toISOString(),periodMonth:globalFilter.month,generatedBy:currentEditor,educator:globalFilter.educator||'',kind:'Relatório de reuniões',html};state.reports.unshift(r);logChange('Relatório de reuniões gerado',humanMonth());save();renderIdeias();openDrawer(r.title,`<div class="actions"><button class="btn primary" onclick="downloadReport('${r.id}','docx')">DOCX</button><button class="btn" onclick="downloadReport('${r.id}','pdf')">PDF</button></div><div class="minutes-preview" style="margin-top:12px">${html}</div>`)}
function downloadBrainstormJSON(){downloadBlob(JSON.stringify({period:currentFilterDescription(),generatedAt:new Date().toISOString(),records:filteredBrainstorms()},null,2),`reunioes_ideias_${globalFilter.month||todayISO()}.json`,'application/json')}
function deleteBrainstorm(id){const b=brainById(id);if(!b||!confirm(`Excluir a sessão “${b.title}” e suas ideias?`))return;state.brainstorms=state.brainstorms.filter(x=>x.id!==id);logChange('Sessão de ideias excluída',b.title);save();renderIdeias();toast('Sessão excluída.')}

/* Inicialização dos filtros */
if(globalFilter.month){const [fy,fm]=globalFilter.month.split('-').map(Number);calendarDate=new Date(fy,fm-1,1)}
renderGlobalFilters();


renderNav(); renderGlobalFilters(); renderPainel();
</script>
